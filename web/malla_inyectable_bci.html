document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

22, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n\n\n<style>\n/* ───────── Tokens ───────── */\n:root{\n  --forest:#1A4D2E;\n  --moss:#5C8DA8;\n  --gold:#C9A227;\n  --cream:#F5F1E8;\n  --char:#212A21;\n  --line:rgba(33,42,33,0.12);\n  --line-strong:rgba(33,42,33,0.32);\n  --muted:rgba(33,42,33,0.58);\n  --on-forest:rgba(245,241,232,0.78);\n  --display:\"Fraunces\", Georgia, serif;\n  --sans:\"Inter\", system-ui, sans-serif;\n  --mono:\"JetBrains Mono\", ui-monospace, monospace;\n}\n\n*,*::before,*::after{ box-sizing:border-box; }\nhtml,body{ margin:0; padding:0; height:100%; background:var(--cream); color:var(--char); font-family:var(--sans); -webkit-font-smoothing:antialiased; }\nbody{ overflow:hidden; cursor:none; }\nbutton{ font:inherit; color:inherit; }\na{ color:inherit; }\n\n/* ───────── Stage / scaling ───────── */\n.stage{\n  position:fixed; inset:0;\n  display:grid; place-items:center;\n  background:#000;\n  overflow:hidden;\n}\n.canvas-1080{\n  width:1920px; height:1080px;\n  background:var(--cream);\n  position:relative;\n  transform-origin:center center;\n  overflow:hidden;\n}\n\n/* ───────── Slide framework ───────── */\n.deck{ position:absolute; inset:0; }\n.slide{\n  position:absolute; inset:0;\n  padding:100px 160px 80px;\n  display:flex; flex-direction:column;\n  opacity:0; pointer-events:none;\n  transition:opacity 600ms ease;\n  background:var(--cream);\n}\n.slide.is-active{ opacity:1; pointer-events:auto; }\n.slide.is-dark{ background:var(--char); color:var(--cream); }\n.slide.is-forest{ background:var(--forest); color:var(--cream); }\n\n/* Fade-through-color veil */\n.veil{\n  position:absolute; inset:0;\n  background:var(--char);\n  opacity:0;\n  pointer-events:none;\n  z-index:90;\n  transition:opacity 280ms ease;\n}\n.veil.is-on{ opacity:1; }\n\n/* Recurring gold rule before titles */\n.rule-gold{\n  display:inline-block;\n  width:2px; height:54px;\n  background:var(--gold);\n  margin-right:24px;\n  vertical-align:middle;\n  transform:translateY(-2px);\n}\n.rule-gold.lg{ height:80px; }\n.eyebrow{\n  font-family:var(--sans);\n  font-size:13px;\n  letter-spacing:0.22em;\n  text-transform:uppercase;\n  color:var(--muted);\n  font-weight:500;\n}\n.is-dark .eyebrow,.is-forest .eyebrow{ color:var(--on-forest); }\n\nh1.display{\n  font-family:var(--display);\n  font-weight:400;\n  font-size:104px;\n  line-height:0.96;\n  letter-spacing:-0.02em;\n  margin:0;\n  text-wrap:balance;\n}\nh2.title{\n  font-family:var(--display);\n  font-weight:400;\n  font-size:72px;\n  line-height:1.02;\n  letter-spacing:-0.018em;\n  margin:0 0 8px 0;\n  text-wrap:balance;\n}\nh3.kicker{\n  font-family:var(--sans);\n  font-weight:500;\n  font-size:18px;\n  letter-spacing:0.04em;\n  color:var(--muted);\n  margin:0 0 56px 0;\n  max-width:62ch;\n}\n.is-dark h3.kicker,.is-forest h3.kicker{ color:var(--on-forest); }\n\n.body-lg{ font-size:21px; line-height:1.55; max-width:62ch; font-weight:400; }\n.body{ font-size:17px; line-height:1.6; max-width:62ch; }\n.mono{ font-family:var(--mono); }\n\n/* ───────── Page chrome ───────── */\n.chrome{\n  position:absolute; left:0; right:0; bottom:0;\n  height:56px;\n  display:flex; align-items:center; justify-content:space-between;\n  padding:0 80px;\n  font-size:12px; letter-spacing:0.18em; text-transform:uppercase;\n  color:var(--muted);\n  z-index:50;\n  pointer-events:none;\n}\n.chrome .left{ display:flex; gap:24px; align-items:center; }\n.chrome .num{ font-family:var(--mono); letter-spacing:0.06em; text-transform:none; }\n.is-dark .chrome,.is-forest .chrome{ color:var(--on-forest); }\n\n/* Progress bar */\n.progress{\n  position:absolute; left:0; bottom:0; height:2px;\n  width:100%; background:transparent;\n  z-index:60;\n}\n.progress::before{\n  content:\"\"; display:block;\n  height:100%; width:var(--pct,0%);\n  background:var(--gold);\n  transition:width 600ms ease;\n}\n\n/* Custom cursor */\n.cursor{\n  position:fixed; top:0; left:0; width:8px; height:8px;\n  border-radius:50%; background:var(--char);\n  pointer-events:none; z-index:9999;\n  transform:translate(-50%,-50%);\n  transition:transform 220ms ease, width 220ms ease, height 220ms ease, background 200ms ease, opacity 200ms ease;\n  mix-blend-mode:difference;\n}\n.cursor.is-hover{ width:36px; height:36px; background:var(--gold); }\n\n/* Side controls */\n.nav-btn{\n  position:fixed; top:50%; transform:translateY(-50%);\n  width:44px; height:44px; border:1px solid var(--line);\n  background:var(--cream); border-radius:999px;\n  display:grid; place-items:center;\n  cursor:none; z-index:200;\n  transition:background 200ms ease, color 200ms ease, border-color 200ms ease;\n  color:var(--char);\n}\n.nav-btn:hover{ background:var(--forest); color:var(--cream); border-color:var(--forest); }\n.nav-prev{ left:24px; }\n.nav-next{ right:24px; }\n.nav-btn svg{ width:14px; height:14px; }\n\n/* Slide counter (top-right) */\n.counter{\n  position:fixed; top:24px; right:32px; z-index:60;\n  font-family:var(--mono); font-size:12px;\n  color:var(--char); background:rgba(245,241,232,0.85);\n  padding:8px 14px; border:1px solid var(--line);\n  border-radius:999px;\n  backdrop-filter:blur(6px);\n}\n\n/* Notes (presenter mode) */\n.notes-pane{\n  position:fixed; right:24px; bottom:80px;\n  width:560px; max-height:48vh; overflow:auto;\n  background:rgba(33,42,33,0.96); color:var(--cream);\n  padding:24px 28px; border-radius:8px; z-index:300;\n  font-size:14px; line-height:1.55;\n  display:none;\n  border-left:2px solid var(--gold);\n  box-shadow:0 12px 50px rgba(0,0,0,0.4);\n}\n.notes-pane.is-on{ display:block; }\n.notes-pane h4{ margin:0 0 8px 0; font-family:var(--display); font-weight:500; font-size:20px; color:var(--gold); }\n\n/* Keyboard hint pill */\n.kbd{\n  font-family:var(--mono); font-size:11px;\n  border:1px solid var(--line-strong); border-bottom-width:2px;\n  padding:1px 6px; border-radius:4px;\n}\n\n/* ───────── Layout helpers ───────── */\n.grid{ display:grid; gap:48px; }\n.row{ display:flex; gap:48px; align-items:flex-start; }\n.spread{ display:grid; grid-template-columns:1fr 1fr; gap:80px; align-items:start; }\n.spread-1-2{ display:grid; grid-template-columns:1fr 1.6fr; gap:96px; align-items:start; }\n.spread-2-1{ display:grid; grid-template-columns:1.6fr 1fr; gap:96px; align-items:start; }\n\n.kpi{\n  font-family:var(--display); font-weight:400;\n  font-size:96px; line-height:0.95; letter-spacing:-0.02em;\n}\n.kpi.sm{ font-size:64px; }\n.kpi-label{ font-size:14px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin-top:6px; }\n.is-dark .kpi-label,.is-forest .kpi-label{ color:var(--on-forest); }\n.kpi-unit{ font-family:var(--sans); font-size:0.34em; font-weight:400; color:var(--muted); margin-left:6px; vertical-align:0.5em; }\n\n.tag{\n  display:inline-flex; align-items:center; gap:8px;\n  font-size:11px; letter-spacing:0.18em; text-transform:uppercase;\n  border:1px solid var(--line-strong); padding:6px 12px; border-radius:999px;\n  color:var(--muted);\n}\n.tag.gold{ border-color:var(--gold); color:var(--gold); }\n\n.hr-thin{ height:1px; background:var(--line); border:0; margin:24px 0; }\n.is-dark .hr-thin,.is-forest .hr-thin{ background:rgba(245,241,232,0.18); }\n\nul.bullets{ list-style:none; padding:0; margin:0; }\nul.bullets li{\n  font-size:18px; line-height:1.55;\n  padding:14px 0 14px 22px;\n  border-top:1px solid var(--line);\n  position:relative;\n}\nul.bullets li:last-child{ border-bottom:1px solid var(--line); }\nul.bullets li::before{\n  content:\"\"; position:absolute; left:0; top:24px;\n  width:8px; height:1px; background:var(--char);\n}\n.is-dark ul.bullets li,.is-forest ul.bullets li{ border-color:rgba(245,241,232,0.16); }\n.is-dark ul.bullets li::before,.is-forest ul.bullets li::before{ background:var(--cream); }\n\n/* Cascade (slide 3) */\n.cascade{ display:grid; grid-template-columns:repeat(6, 1fr); gap:0; align-items:stretch; }\n.cascade .step{\n  border-left:1px solid rgba(245,241,232,0.18);\n  padding:28px 20px;\n  position:relative;\n}\n.cascade .step:first-child{ border-left:none; }\n.cascade .step .num{\n  font-family:var(--display); font-size:48px; line-height:1; color:var(--gold); font-weight:400;\n}\n.cascade .step .txt{ margin-top:14px; font-size:15px; line-height:1.45; color:var(--on-forest); max-width:18ch; }\n\n/* Bar chart (stiffness, slide 11/6) */\n.barchart{ display:flex; flex-direction:column; gap:18px; }\n.bar-row{ display:grid; grid-template-columns:240px 1fr 200px; align-items:center; gap:20px; }\n.bar-row .name{ font-size:15px; }\n.bar-row .name .sub{ display:block; font-size:12px; color:var(--muted); margin-top:2px; }\n.bar-track{ position:relative; height:14px; background:rgba(33,42,33,0.06); border-radius:1px; overflow:hidden; }\n.bar-fill{\n  position:absolute; left:0; top:0; bottom:0;\n  width:0%; background:var(--char);\n  transition:width 1.4s cubic-bezier(0.65,0,0.35,1);\n}\n.bar-row.is-mesh .bar-fill{ background:var(--forest); animation:meshpulse 2s ease-in-out infinite; }\n.bar-row.is-mesh .name{ color:var(--forest); font-weight:500; }\n@keyframes meshpulse{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.08); } }\n.bar-row .val{ font-family:var(--mono); font-size:14px; text-align:right; color:var(--char); }\n.bar-row .val .unit{ color:var(--muted); }\n\n.log-axis{\n  display:grid; grid-template-columns:240px 1fr 200px; gap:20px;\n  font-family:var(--mono); font-size:11px; color:var(--muted);\n  margin-top:8px; padding-top:10px; border-top:1px solid var(--line);\n}\n.log-axis .ticks{\n  display:flex; justify-content:space-between;\n}\n\n/* Hagen-Poiseuille table (slide 12) */\ntable.hp{ width:100%; border-collapse:collapse; }\ntable.hp th, table.hp td{\n  text-align:left; padding:18px 14px;\n  border-bottom:1px solid var(--line);\n  font-size:17px;\n}\ntable.hp th{ font-weight:500; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); }\ntable.hp td.num{ font-family:var(--mono); }\ntable.hp tr.hl td{ background:rgba(201,162,39,0.08); }\ntable.hp tr.hl td:first-child{ position:relative; }\ntable.hp tr.hl td:first-child::before{ content:\"\"; position:absolute; left:0; top:18px; bottom:18px; width:2px; background:var(--gold); }\n\n/* Compare cards (slide 14) */\n.cmp{ display:grid; grid-template-columns:repeat(3,1fr); gap:32px; }\n.cmp .card{ padding:36px 32px; border:1px solid var(--line); background:#fff; min-height:520px; display:flex; flex-direction:column; }\n.cmp .card.us{ border-color:var(--forest); border-width:1px; box-shadow:inset 2px 0 0 var(--gold); }\n.cmp .card h4{ font-family:var(--display); font-weight:500; font-size:32px; line-height:1.05; margin:0 0 8px 0; }\n.cmp .card .sub{ font-size:14px; color:var(--muted); margin-bottom:24px; line-height:1.45; }\n.cmp .card .pro{ font-size:14px; line-height:1.5; padding:8px 0; border-top:1px solid var(--line); }\n.cmp .card .pro.con{ color:var(--muted); }\n.cmp .card .verdict{ margin-top:auto; padding-top:24px; font-family:var(--display); font-style:italic; font-size:18px; }\n.cmp .card.us .verdict{ color:var(--forest); }\n\n/* Slide 4 — 3D */\n#three-host{\n  position:absolute; inset:0;\n}\n#three-host canvas{ display:block; width:100%; height:100%; }\n.s4-overlay{\n  position:absolute; inset:0; pointer-events:none;\n  display:grid; grid-template-columns:1fr 1fr;\n}\n.s4-left{ padding:100px 80px 80px 160px; pointer-events:auto; }\n.s4-right{ position:relative; }\n.s4-controls{\n  position:absolute; right:64px; bottom:96px;\n  display:flex; gap:10px; pointer-events:auto;\n  z-index:5;\n}\n.btn-pill{\n  font-family:var(--sans); font-size:13px; letter-spacing:0.04em;\n  padding:10px 18px; border:1px solid var(--char);\n  background:var(--cream); color:var(--char);\n  border-radius:999px; cursor:none;\n  transition:background 180ms ease, color 180ms ease;\n}\n.btn-pill:hover, .btn-pill.is-on{ background:var(--char); color:var(--cream); }\n.btn-pill.gold.is-on{ background:var(--gold); border-col ack{ height:18px; }\n\n/* Slide 13 — Nyquist diagram */\n.nyquist-wrap{\n  position:relative;\n  height:420px;\n  border-left:1px solid var(--line);\n  border-bottom:1px solid var(--line);\n  padding:8px;\n}\n.nyquist-wrap svg{ width:100%; height:100%; }\n\n/* Slide 15 — KPI grid */\n.kpi-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:48px 64px; }\n.kpi-grid .cell{ border-top:1px solid var(--line); padding-top:18px; }\n\n/* Slide 18 — quote */\n.pull-quote{\n  font-family:var(--display); font-style:italic; font-weight:400;\n  font-size:54px; line-height:1.18; letter-spacing:-0.01em;\n  max-width:24ch;\n  text-wrap:balance;\n}\n.pull-quote::before{ content:\"“\"; color:var(--gold); margin-right:6px; }\n.pull-quote::after{ content:\"”\"; color:var(--gold); }\n\n/* Slide 19 — references */\n.refs{ columns:2; column-gap:80px; column-rule:1px solid var(--line); }\n.refs .ref{ break-inside:avoid; padding:14px 0; border-bottom:1px solid var(--line); }\n.refs .ref .yr{ font-family:var(--mono); font-size:12px; color:var(--gold); letter-spacing:0.06em; }\n.refs .ref .ti{ font-size:15px; line-height:1.4; margin-top:4px; }\n.refs .ref .au{ font-size:13px; color:var(--muted); margin-top:4px; }\n\n/* Cover (slide 1) */\n.cover{\n  display:grid; grid-template-columns:1.5fr 1fr; gap:64px;\n  height:100%;\n}\n.cover .L{ display:flex; flex-direction:column; justify-content:space-between; padding-right:40px; }\n.cover .R{ position:relative; }\n.cover-mark{\n  position:absolute; right:0; top:0;\n  width:340px; height:340px;\n}\n.cover-meta{\n  display:grid; grid-template-columns:repeat(3,1fr); gap:32px;\n  border-top:1px solid var(--line); padding-top:28px;\n}\n.cover-meta .lab{ font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }\n.cover-meta .val{ font-size:16px; }\n\n/* Agenda (slide 2) */\n.agenda{ display:grid; grid-template-columns:1fr 1fr; gap:14px 96px; }\n.agenda .item{\n  display:grid; grid-template-columns:54px 1fr;\n  padding:18px 0; border-top:1px solid var(--line);\n  align-items:baseline;\n}\n.agenda .item .n{ font-family:var(--mono); font-size:13px; color:var(--gold); }\n.agenda .item .t{ font-family:var(--display); font-size:26px; font-weight:400; line-height:1.1; }\n.agenda .item .d{ grid-column:2; font-size:14px; color:var(--muted); margin-top:4px; }\n\n/* Section divider (forest bg) */\n.divider{\n  display:flex; flex-direction:column; justify-content:center;\n  background:var(--forest); color:var(--cream);\n}\n.divider .num{\n  font-family:var(--mono); font-size:14px; letter-spacing:0.2em; color:var(--gold);\n}\n.divider h2{ margin-top:18px; font-size:120px; }\n\n/* equation block */\n.eq{\n  font-family:var(--mono); font-size:18px;\n  background:rgba(33,42,33,0.04);\n  padding:16px 20px; border-left:2px solid var(--gold);\n  display:inline-block;\n}\n.is-dark .eq,.is-forest .eq{ background:rgba(245,241,232,0.06); }\n\n/* utility */\n.tnum{ font-variant-numeric:tabular-nums; }\n.dim{ color:var(--muted); }\n.gold{ color:var(--gold); }\n.forest{ color:var(--forest); }\n.flex{ display:flex; }\n.flex-col{ flex-direction:column; }\n.gap-8{ gap:8px; } .gap-16{ gap:16px; } .gap-24{ gap:24px; } .gap-32{ gap:32px; } .gap-48{ gap:48px; }\n.mt-8{ margin-top:8px; } .mt-16{ margin-top:16px; } .mt-24{ margin-top:24px; } .mt-32{ margin-top:32px; } .mt-48{ margin-top:48px; } .mt-64{ margin-top:64px; }\n.text-sm{ font-size:14px; } .text-xs{ font-size:12px; }\n<\u002Fstyle>\n<\u002Fhead>\n\n<body>\n<div class=\"cursor\" id=\"cursor\"><\u002Fdiv>\n\n<div class=\"stage\" id=\"stage\">\n  <div class=\"canvas-1080\" id=\"canvas\">\n    <div class=\"deck\" id=\"deck\"><\u002Fdiv>\n    <div class=\"veil\" id=\"veil\"><\u002Fdiv>\n    <div class=\"progress\" id=\"progress\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"counter\" id=\"counter\">01 / 20<\u002Fdiv>\n<button class=\"nav-btn nav-prev\" id=\"prev\" aria-label=\"Anterior\">\n  <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M15 6l-6 6 6 6\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<button class=\"nav-btn nav-next\" id=\"next\" aria-label=\"Siguiente\">\n  <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n\n<div class=\"notes-pane\" id=\"notes\">\n  <h4>Notas del presentador<\u002Fh4>\n  <div id=\"notes-body\"><\u002Fdiv>\n  <div class=\"hr-thin\" style=\"background:rgba(245,241,232,0.18); margin:14px 0;\"><\u002Fdiv>\n  <div style=\"font-size:11px; color:rgba(245,241,232,0.6); letter-spacing:0.08em;\">\n    <span class=\"kbd\">N<\u002Fspan> notas · <span class=\"kbd\">F<\u002Fspan> fullscreen · <span class=\"kbd\">←/→<\u002Fspan> navegar · <span class=\"kbd\">Espacio<\u002Fspan> pausar 3D\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ===========================================================================\n     SLIDE TEMPLATE (DOM is built by JS — see SLIDES array at bottom).\n     The slides are intentionally inline-templated below for easy editing.\n     =========================================================================== -->\n<template id=\"tpl-slides\">\n\n<!-- 01 — COVER -->\n<section class=\"slide\" data-slide=\"01\">\n  <div class=\"cover\">\n    <div class=\"L\">\n      <div>\n        <div class=\"eyebrow\">Universidad de Guadalajara · CUTLAJOMULCO · Ingeniería Biomédica<\u002Fdiv>\n        <div class=\"mt-32\"><\u002Fdiv>\n        <h1 class=\"display\"><span class=\"rule-gold lg\"><\u002Fspan>Caracterización<br>mecánica e<br>hidrodinámica<br><em style=\"font-style:italic; color:var(--forest);\">de una malla<br>electrónica inyectable<\u002Fem><\u002Fh1>\n      <\u002Fdiv>\n      <div class=\"cover-meta\">\n        <div><div class=\"lab\">Presenta<\u002Fdiv><div class=\"val\">Christofer Martín<br>Rojas Ruiz<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"lab\">Asesora<\u002Fdiv><div class=\"val\">Mtra. Gabriela<br>Hinojosa<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"lab\">Periodo<\u002Fdiv><div class=\"val\">Mayo 2026<br>Guadalajara, Jalisco<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"R\">\n      <svg class=\"cover-mark\" viewBox=\"0 0 340 340\">\n        <!-- Stylised mesh motif -->\n        <defs>\n          <pattern id=\"msh\" width=\"34\" height=\"34\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\">\n            <path d=\"M0 17 L34 17\" stroke=\"#1A4D2E\" stroke-width=\"1\" fill=\"none\"><\u002Fpath>\n            <path d=\"M17 0 L17 34\" stroke=\"#1A4D2E\" stroke-width=\"1\" fill=\"none\"><\u002Fpath>\n          <\u002Fpattern>\n        <\u002Fdefs>\n        <circle cx=\"170\" cy=\"170\" r=\"160\" fill=\"none\" stroke=\"#1A4D2E\" stroke-width=\"1\"><\u002Fcircle>\n        <circle cx=\"170\" cy=\"170\" r=\"120\" fill=\"url(#msh)\" opacity=\"0.7\"><\u002Fcircle>\n        <circle cx=\"170\" cy=\"170\" r=\"120\" fill=\"none\" stroke=\"#1A4D2E\" stroke-width=\"1\"><\u002Fcircle>\n        <!-- Pt electrodes -->\n        <g fill=\"#C9A227\">\n          <circle cx=\"120\" cy=\"140\" r=\"3\"><\u002Fcircle><circle cx=\"160\" cy=\"120\" r=\"3\"><\u002Fcircle><circle cx=\"200\" cy=\"140\" r=\"3\"><\u002Fcircle>\n          <circle cx=\"220\" cy=\"180\" r=\"3\"><\u002Fcircle><circle cx=\"200\" cy=\"220\" r=\"3\"><\u002Fcircle><circle cx=\"160\" cy=\"240\" r=\"3\"><\u002Fcircle>\n          <circle cx=\"120\" cy=\"220\" r=\"3\"><\u002Fcircle><circle cx=\"100\" cy=\"180\" r=\"3\"><\u002Fcircle>\n        <\u002Fg>\n        <text x=\"170\" y=\"320\" text-anchor=\"middle\" font-family=\"JetBrains Mono\" font-size=\"10\" fill=\"#1A4D2E\" letter-spacing=\"2\">SU-8 / Au / SU-8 · α = 45°<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 02 — AGENDA -->\n<section class=\"slide\" data-slide=\"02\">\n  <div class=\"eyebrow\"><span class=\"rule-gold\"><\u002Fspan>Agenda<\u002Fdiv>\n  <h2 class=\"title mt-16\">Lo que cubriremos<br>en esta sesión.<\u002Fh2>\n  <h3 class=\"kicker\">Ocho movimientos: del problema clínico a las conclusiones, con tres ejes técnicos en el medio — mecánica, hidrodinámica, electroquímica.<\u002Fh3>\n  <div class=\"agenda\">\n    <div class=\"item\"><div class=\"n\">01<\u002Fdiv><div><div class=\"t\">El problema clínico<\u002Fdiv><div class=\"d\">Por qué los BCI fallan tras semanas o meses<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"item\"><div class=\"n\">02<\u002Fdiv><div><div class=\"t\">El biomaterial<\u002Fdiv><div class=\"d\">Malla compuesta SU-8 / Au, arquitectura y composición<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"item\"><div class=\"n\">03<\u002Fdiv><div><div class=\"t\">Hipótesis y objetivos<\u002Fdiv><div class=\"d\">Variables de respuesta y plan de validación<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"item\"><div class=\"n\">04<\u002Fdiv><div><div class=\"t\">Caracterización mecánica<\u002Fdiv><div class=\"d\">Rigidez efectiva, módulo de flexión, AFM<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"item\"><div class=\"n\">05<\u002Fdiv><div><div class=\"t\">Caracterización hidrodinámica<\u002Fdiv><div class=\"d\">Inyección capilar y modelo de Hagen-Poiseuille<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"item\"><div class=\"n\">06<\u002Fdiv><div><div class=\"t\">Modelado <em>in silico<\u002Fem><\u002Fdiv><div class=\"d\">Simulación 3D + viga compuesta + circuito de Randles<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"item\"><div class=\"n\">07<\u002Fdiv><div><div class=\"t\">Resultados esperados<\u002Fdiv><div class=\"d\">Lo que predice la teoría y la simulación<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"item\"><div class=\"n\">08<\u002Fdiv><div><div class=\"t\">Discusión y conclusiones<\u002Fdiv><div class=\"d\">Comparativa con Neuropixels y arquitecturas rivales<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 03 — PROBLEM -->\n<section class=\"slide is-forest\" data-slide=\"03\">\n  <div class=\"eyebrow\"><span class=\"rule-gold\"><\u002Fspan>01 · Problema<\u002Fdiv>\n  <h2 class=\"title mt-16\" style=\"color:var(--cream);\">Desajuste mecánico entre<br><em style=\"font-style:italic; color:var(--gold);\">el implante y el cerebro.<\u002Fem><\u002Fh2>\n  <h3 class=\"kicker\">Cuando un material 5-6 órdenes de magnitud más rígido se ancla a un tejido del peso de un gel, la física hace su trabajo: la interfaz se rompe.<\u002Fh3>\n\n  <div class=\"grid mt-32\" style=\"grid-template-columns:repeat(3,1fr); gap:48px;\">\n    <div>\n      <div class=\"kpi\" style=\"color:var(--cream);\">0.1<span class=\"kpi-unit\">–1 kPa<\u002Fspan><\u002Fdiv>\n      <div class=\"kpi-label\">Tejido cerebral<\u002Fdiv>\n      <div class=\"body mt-8\" style=\"color:var(--on-forest); max-width:24ch;\">Como un gel de tofu — viscoelástico, hidratado, en movimiento.<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div class=\"kpi\" style=\"color:var(--cream);\">150<span class=\"kpi-unit\">GPa<\u002Fspan><\u002Fdiv>\n      <div class=\"kpi-label\">Silicio<\u002Fdiv>\n      <div class=\"body mt-8\" style=\"color:var(--on-forest); max-width:24ch;\">Cinco a seis órdenes de magnitud más rígido que el sustrato.<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div class=\"kpi\" style=\"color:var(--gold);\">&gt; 90<span class=\"kpi-unit\">%<\u002Fspan><\u002Fdiv>\n      <div class=\"kpi-label\">Pérdida de señal<\u002Fdiv>\n      <div class=\"body mt-8\" style=\"color:var(--on-forest); max-width:24ch;\">En semanas a pocos meses con electrodos rígidos convencionales.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"mt-48\" style=\"margin-top:auto; padding-top:40px;\">\n    <div class=\"eyebrow\" style=\"color:var(--gold);\">La cascada de fallo<\u002Fdiv>\n    <div class=\"cascade mt-16\">\n      <div class=\"step\"><div class=\"num\">1<\u002Fdiv><div class=\"txt\">Implante rígido en tejido blando<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"num\">2<\u002Fdiv><div class=\"txt\">Micromovimientos cardio-respiratorios<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"num\">3<\u002Fdiv><div class=\"txt\">Cizallamiento crónico en la interfaz<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"num\">4<\u002Fdiv><div class=\"txt\">Activación de microglia + astrocitos<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"num\">5<\u002Fdiv><div class=\"txt\">Cicatriz glial fibrosa<\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"num\">6<\u002Fdiv><div class=\"txt\">Aumento de impedancia y pérdida de señal<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 04 — 3D BIOMATERIAL (CORE) -->\n<section class=\"slide\" data-slide=\"04\" data-no-padding=\"1\" style=\"padding:0;\">\n  <div id=\"three-host\"><\u002Fdiv>\n  <div class=\"three-label\" id=\"lbl-1\">SU-8 inferior · 500 nm<\u002Fdiv>\n  <div class=\"three-label\" id=\"lbl-2\">Au · 100 nm — plano neutro<\u002Fdiv>\n  <div class=\"three-label\" id=\"lbl-3\">SU-8 superior · 500 nm<\u002Fdiv>\n  <div class=\"three-label\" id=\"lbl-4\">Electrodo Pt · 20 µm<\u002Fdiv>\n\n  <div class=\"s4-overlay\">\n    <div class=\"s4-left\">\n      <div class=\"eyebrow\"><span class=\"rule-gold\"><\u002Fspan>02 · El biomaterial<\u002Fdiv>\n      <h2 class=\"title mt-16\">Syringe-injectable<br><em style=\"font-style:italic; color:var(--forest);\">mesh electronics.<\u002Fem><\u002Fh2>\n      <h3 class=\"kicker\">Cintas longitudinales rectas, transversales en zigzag a α = 45°, dieciséis electrodos de platino. Au encapsulado en el plano neutro mecánico.<\u002Fh3>\n      <ul class=\"bullets\" style=\"max-width:46ch;\">\n        <li>Esqueleto SU-8 / Au / SU-8 — sándwich polímero-metal-polímero<\u002Fli>\n        <li>Au de 100 nm centrado en el plano neutro: el metal nunca tracciona<\u002Fli>\n        <li>16 electrodos de Pt para registro y estimulación<\u002Fli>\n        <li>Inyectable a través de aguja de 100 µm — sin trepanación mayor<\u002Fli>\n        <li>Rigidez efectiva ~ 0.1 nN·m — coincide con tejido neural<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"s4-right\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"s4-controls\">\n    <button class=\"btn-pill\" id=\"btn-rotate\">⟳ Auto-rotación<\u002Fbutton>\n    <button class=\"btn-pill gold\" id=\"btn-section\">Sección transversal<\u002Fbutton>\n    <button class=\"btn-pill\" id=\"btn-reset\">Reset cámara<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 05 — INJECTION ANIMATION -->\n<section class=\"slide\" data-slide=\"05\">\n  <div class=\"eyebrow\"><span class=\"rule-gold\"><\u002Fspan>03 · Inyección capilar<\u002Fdiv>\n  <h2 class=\"title mt-16\">De la malla plana<br>al despliegue <em style=\"font-style:italic; color:var(--forest);\">in tissue<\u002Fem>.<\u002Fh2>\n  <h3 class=\"kicker\">Cuatro fases — plano libre → enrollado capilar → extrusión por orificio de 100 µm → despliegue autónomo en gel cerebral. Arrastra el deslizador para detener la fase que necesites explicar.<\u002Fh3>\n\n  <div class=\"inj-stage\">\n    <canvas id=\"inj-canvas\"><\u002Fcanvas>\n    <div class=\"inj-phase-label\"><span class=\"pn\" id=\"inj-pnum\">01<\u002Fspan><span id=\"inj-pname\">Plano libre<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"inj-controls\">\n    <input type=\"range\" min=\"0\" max=\"1000\" value=\"0\" class=\"inj-slider\" id=\"inj-slider\">\n    <button class=\"btn-pill\" id=\"inj-play\">⏵ Reproducir<\u002Fbutton>\n    <div class=\"inj-speed\">\n      <button data-spd=\"0.5\">0.5×<\u002Fbutton>\n      <button data-spd=\"1\" class=\"is-on\">1×<\u002Fbutton>\n      <button data-spd=\"2\">2×<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 06 — STIFFNESS COMPARATIVE (animated log scale) -->\n<section class=\"slide\" data-slide=\"06\">\n  <div class=\"eyebrow\"><span class=\"rule-gold\"><\u002Fspan>04 · Caracterización mecánica<\u002Fdiv>\n  <h2 class=\"title mt-16\">Rigidez efectiva — <em style=\"font-style:italic; color:var(--forest);\">escala logarítmica.<\u002Fem><\u002Fh2>\n  <h3 class=\"kicker\">Seis órdenes de magnitud entre el silicio y el tejido neural. Nuestro objetivo: aterrizar la malla justo donde vive el axón mielinizado.<\u002Fh3>\n\n  <div class=\"row mt-32\" style=\"gap:80px; align-items:flex-start;\">\n    <div style=\"flex:1;\" class=\"barchart-big\" id=\"barchart-stiff\">\n      <div class=\"bar-row\" data-val=\"100\"><div class=\"name\">Silicio (CMOS / Neuropixels)<span class=\"sub\">E·I de sonda 50×50 µm × 100 GPa<\u002Fspan><\u002Fdiv><div class=\"bar-track\"><div class=\"bar-fill\"><\u002Fdiv><\u002Fdiv><div class=\"val tnum\"><span class=\"num\" data-target=\"1e-6\" data-decimals=\"0\">0<\u002Fspan><span class=\"unit\"> N·m²<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"bar-row\" data-val=\"73\"><div class=\"name\">Microhilo de poliimida<span class=\"sub\">Neuralink N1 — 96 hilos<\u002Fspan><\u002Fdiv><div class=\"bar-track\"><div class=\"bar-fill\"><\u002Fdiv><\u002Fdiv><div class=\"val tnum\"><span class=\"num\" data-target=\"1e-13\" data-decimals=\"0\">0<\u002Fspan><span class=\"unit\"> N·m²<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"bar-row is-mesh\" data-val=\"50\"><div class=\"name\"><strong>Malla inyectable SU-8 / Au<\u002Fstrong><span class=\"sub\">α = 45°, este trabajo<\u002Fspan><\u002Fdiv><div class=\"bar-track\"><div class=\"bar-fill\"><\u002Fdiv><\u002Fdiv><div class=\"val tnum\"><span class=\"num\" data-target=\"1e-16\" data-decimals=\"0\">0<\u002Fspan><span class=\"unit\"> N·m²<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"bar-row\" data-val=\"45\"><div class=\"name\">Axón mielinizado<span class=\"sub\">tejido neural — referencia biológica<\u002Fspan><\u002Fdiv><div class=\"bar-track\"><div class=\"bar-fill\"><\u002Fdiv><\u002Fdiv><div class=\"val tnum\"><span class=\"num\" data-target=\"1e-13\" data-decimals=\"0\">0<\u002Fspan><span class=\"unit\"> N·m²<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"log-axis\"><div><\u002Fdiv><div class=\"ticks\"><span>10⁻¹⁸<\u002Fspan><span>10⁻¹⁶<\u002Fspan><span>10⁻¹⁴<\u002Fspan><span>10⁻¹²<\u002Fspan><span>10⁻¹⁰<\u002Fspan><span>10⁻⁸<\u002Fspan><span>10⁻⁶<\u002Fspan><\u002Fdiv><div><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"width:340px; flex-shrink:0;\">\n      <div class=\"tag gold\">Hallazgos clave<\u002Fdiv>\n      <div class=\"mt-24\">\n        <div class=\"kpi sm tnum\"><span class=\"num-counter\" data-target=\"9.82\" data-decimals=\"2\">0<\u002Fspan><span class=\"kpi-unit\">fN·m²<\u002Fspan><\u002Fdiv>\n        <div class=\"kpi-label\">Rigidez por cinta longitudinal<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"mt-32\">\n        <div class=\"kpi sm tnum\"><span class=\"num-counter\" data-target=\"0.49\" data-decimals=\"2\">0<\u002Fspan><span class=\"kpi-unit\">nN·m<\u002Fspan><\u002Fdiv>\n        <div class=\"kpi-label\">D_eff por unidad de ancho<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"mt-32\">\n        <div class=\"kpi sm forest\">0.087<span style=\"font-size:0.6em; color:var(--muted);\"> – <\u002Fspan>0.15<span class=\"kpi-unit\">nN·m<\u002Fspan><\u002Fdiv>\n        <div class=\"kpi-label\">Malla 2D completa · α = 45°<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 07 — Composition / classification -->\n<section class=\"slide\" data-slide=\"07\">\n  <div class=\"eyebrow\"><span class=\"rule-gold\"><\u002Fspan>05 · Composición<\u002Fdiv>\n  <h2 class=\"title mt-16\">Compuesto sintético<br><em style=\"font-style:italic; color:var(--forest);\">bifásico — biotolerado, neuro-fílico.<\u002Fem><\u002Fh2>\n  <h3 class=\"kicker\">Dos fases con funciones complementarias y una clasificación cuádruple que ubica al material en su nicho funcional.<\u002Fh3>\n\n  <div class=\"spread mt-32\">\n    <div>\n      <div class=\"tag\">Fase polimérica · matriz<\u002Fdiv>\n      <ul class=\"bullets mt-16\">\n        <li><strong>SU-8<\u002Fstrong> — resina epóxica negativa, E ≈ 4.4 GPa<\u002Fli>\n        <li><strong>Poliimida<\u002Fstrong> (alternativa) — E ≈ 2.5 GPa<\u002Fli>\n        <li>Funciones: andamiaje, pasivación, plano neutro<\u002Fli>\n        <li><em>Patterning<\u002Fem> litográfico a escala nanométrica<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div>\n      <div class=\"tag gold\">Fase metálica · conductora<\u002Fdiv>\n      <ul class=\"bullets mt-16\">\n        <li><strong>Au<\u002Fstrong> (interconexiones) — ρ = 2.44 × 10⁻⁸ Ω·m<\u002Fli>\n        <li><strong>Pt<\u002Fstrong> (electrodos de registro/estim.) — ρ = 1.06 × 10⁻⁷ Ω·m<\u002Fli>\n        <li>Inercia electroquímica en entorno fisiológico<\u002Fli>\n        <li>Recubrimiento PEDOT:PSS opcional para reducir |Z|<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"mt-48\">\n    <div class=\"eyebrow\">Clasificación cuádruple<\u002Fdiv>\n    <div class=\"grid mt-16\" style=\"grid-template-columns:repeat(4,1fr); gap:32px;\">\n      <div><div class=\"text-xs dim\" style=\"letter-spacing:0.2em; text-transform:uppercase;\">Por composición<\u002Fdiv><div class=\"mt-8\" style=\"font-family:var(--display); font-size:24px;\">Compuesto sintético<br><span class=\"dim text-sm\" style=\"font-family:var(--sans);\">polímero + metal<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div><div class=\"text-xs dim\" style=\"letter-spacing:0.2em; text-transform:uppercase;\">Por respuesta biológica<\u002Fdiv><div class=\"mt-8\" style=\"font-family:var(--display); font-size:24px;\">Biotolerado<br><span class=\"dim text-sm\" style=\"font-family:var(--sans);\">neuro-fílico<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div><div class=\"text-xs dim\" style=\"letter-spacing:0.2em; text-transform:uppercase;\">Por estructura<\u002Fdiv><div class=\"mt-8\" style=\"font-family:var(--display); font-size:24px;\">Macroporoso 3D<br><span class=\"dim text-sm\" style=\"font-family:var(--sans);\">porosidad &gt; 90 %<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div><div class=\"text-xs dim\" style=\"letter-spacing:0.2em; text-transform:uppercase;\">Por aplicación<\u002Fdiv><div class=\"mt-8\" style=\"font-family:var(--display); font-size:24px;\">Bioelectrónico<br><span class=\"dim text-sm\" style=\"font-family:var(--sans);\">implante crónico<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 08 — Why revolutionary -->\n<section class=\"slide is-dark\" data-slide=\"08\">\n  <div class=\"eyebrow\"><span class=\"rule-gold\"><\u002Fspan>Por qué este biomaterial es revolucionario<\u002Fdiv>\n  <h2 class=\"title mt-16\" style=\"color:var(--cream);\">El implante deja de ser<br><em style=\"font-style:italic; color:var(--gold);\">un cuerpo extraño.<\u002Fem><\u002Fh2>\n  <h3 class=\"kicker\">Cuando la rigidez del implante coincide con la del tejido y los axones lo atraviesan como atraviesan una matriz extracelular cualquiera, el sistema inmune deja de reaccionar.<\u002Fh3>\n\n  <div class=\"grid mt-48\" style=\"grid-template-columns:repeat(4,1fr); gap:48px;\">\n    <div><div class=\"kpi\" style=\"color:var(--cream);\">0.1<span class=\"kpi-unit\">nN·m<\u002Fspan><\u002Fdiv><div class=\"kpi-label\">Rigidez efectiva = tejido neural<\u002Fdiv><\u002Fdiv>\n    <div><div class=\"kpi\" style=\"color:var(--cream);\">100<span class=\"kpi-unit\">µm<\u002Fspan><\u002Fdiv><div class=\"kpi-label\">Diámetro mínimo de aguja<\u002Fdiv><\u002Fdiv>\n    <div><div class=\"kpi\" style=\"color:var(--cream);\">&gt; 90<span class=\"kpi-unit\">%<\u002Fspan><\u002Fdiv><div class=\"kpi-label\">Porosidad — integración tisular<\u002Fdiv><\u002Fdiv>\n    <div><div class=\"kpi\" style=\"color:var(--gold);\">8<span class=\"kpi-unit\">meses<\u002Fspan><\u002Fdiv><div class=\"kpi-label\">Registro estable de neurona única<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"mt-64\" style=\"margin-top:auto; padding-top:48px;\">\n    <div class=\"pull-quote\" style=\"font-size:36px; max-width:none;\">Sin gliosis crónica, sin desplazamiento, sin pérdida de señal. Las neuronas crecen <span class=\"gold\">a través<\u002Fspan> de los poros como si la malla fuera tejido nativo.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 09 — Hypothesis & objectives -->\n<section class=\"slide\" data-slide=\"09\">\n  <div class=\"eyebrow\"><span class=\"rule-gold\"><\u002Fspan>03 · Hipótesis y objetivos<\u002Fdiv>\n  <h2 class=\"title mt-16\">La apuesta del proyecto.<\u002Fh2>\n\n  <div class=\"mt-32\" style=\"background:rgba(26,77,46,0.05); padding:40px 48px; border-left:2px solid var(--gold);\">\n    <div class=\"tag gold\">Hipótesis central<\u002Fdiv>\n    <div class=\"mt-16\" style=\"font-family:var(--display); font-size:32px; line-height:1.25; max-width:60ch; font-weight:400;\">\n      Optimizando la relación <em>grosor polímero / ancho metálico<\u002Fem> y el ángulo α de entrelazado, el biocompuesto soporta la inyección capilar a través de agujas ≤ 100 µm preservando el <span class=\"gold\">100 %<\u002Fspan> de su integridad estructural y la conductividad basal de los nanocables.\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"mt-48\">\n    <div class=\"eyebrow\">Objetivos específicos<\u002Fdiv>\n    <div class=\"grid mt-16\" style=\"grid-template-columns:repeat(5,1fr); gap:24px;\">\n      <div style=\"border-top:1px solid var(--char); padding-top:18px;\"><div class=\"mono gold\">01<\u002Fdiv><div class=\"mt-8\" style=\"font-size:15px; line-height:1.4;\">Diseñar y fabricar la malla SU-8 / Au / SU-8 por fotolitografía<\u002Fdiv><\u002Fdiv>\n      <div style=\"border-top:1px solid var(--char); padding-top:18px;\"><div class=\"mono gold\">02<\u002Fdiv><div class=\"mt-8\" style=\"font-size:15px; line-height:1.4;\">Caracterizar la rigidez efectiva — analítico + AFM + simulación FEM<\u002Fdiv><\u002Fdiv>\n      <div style=\"border-top:1px solid var(--char); padding-top:18px;\"><div class=\"mono gold\">03<\u002Fdiv><div class=\"mt-8\" style=\"font-size:15px; line-height:1.4;\">Evaluar la dinámica de inyección hidrodinámica capilar<\u002Fdiv><\u002Fdiv>\n      <div style=\"border-top:1px solid var(--char); padding-top:18px;\"><div class=\"mono gold\">04<\u002Fdiv><div class=\"mt-8\" style=\"font-size:15px; line-height:1.4;\">Modelar <em>in silico<\u002Fem> rigidez, presión de extrusión e impedancia<\u002Fdiv><\u002Fdiv>\n      <div style=\"border-top:1px solid var(--char); padding-top:18px;\"><div class=\"mono gold\">05<\u002Fdiv><div class=\"mt-8\" style=\"font-size:15px; line-height:1.4;\">Verificar la integridad eléctrica post-inyección por EIS<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 10 — Mechanical characterization (3 approaches) -->\n<section class=\"slide\" data-slide=\"10\">\n  <div class=\"eyebrow\"><span class=\"rule-gold\"><\u002Fspan>04 · Caracterización mecánica<\u002Fdiv>\n  <h2 class=\"title mt-16\">Tres aproximaciones,<br><em style=\"font-style:italic; color:var(--forest);\">una sola variable de respuesta.<\u002Fem><\u002Fh2>\n  <h3 class=\"kicker\">Cálculo cerrado, simulación numérica y medición experimental directa — convergiendo sobre el módulo de flexión efectivo.<\u002Fh3>\n\n  <div class=\"grid mt-32\" style=\"grid-template-columns:repeat(3,1fr); gap:48px;\">\n    <div style=\"border-top:1px solid var(--char); padding-top:24px;\">\n      <div class=\"mono gold\">01 · Analítico<\u002Fdiv>\n      <h4 style=\"font-family:var(--display); font-weight:500; font-size:30px; margin:12px 0; line-height:1.1;\">Viga compuesta de Euler–Bernoulli<\u002Fh4>\n      <div class=\"body\">Estimación cerrada de EI<sub>eff<\u002Fsub> con teorema de ejes paralelos a partir de la geometría litográfica.<\u002Fdiv>\n      <div class=\"eq mt-16\">EI<sub>eff<\u002Fsub> = Σ Eᵢ·(Iᵢ + Aᵢ·dᵢ²)<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid var(--char); padding-top:24px;\">\n      <div class=\"mono gold\">02 · <em>In silico<\u002Fem><\u002Fdiv>\n      <h4 style=\"font-family:var(--display); font-weight:500; font-size:30px; margin:12px 0; line-height:1.1;\">Modelo Python — NumPy / SciPy<\u002Fh4>\n      <div class=\"body\">Predice plano neutro, rigidez efectiva y el efecto del ángulo α. Validación previa a la fabricación.<\u002Fdiv>\n      <div class=\"eq mt-16\">α ∈ [30°, 60°] · ∂D/∂α<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid var(--char); padding-top:24px;\">\n      <div class=\"mono gold\">03 · Experimental<\u002Fdiv>\n      <h4 style=\"font-family:var(--display); font-weight:500; font-size:30px; margin:12px 0; line-height:1.1;\">AFM en modo deflexión<\u002Fh4>\n      <div class=\"body\">Cargas controladas (nN) sobre la malla libre en PBS. Medición directa del módulo de flexión efectivo.<\u002Fdiv>\n      <div class=\"eq mt-16\">F = k·δ · k ≈ 0.1 N/m<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"mt-48\" style=\"border-top:1px solid var(--char); padding-top:24px; max-width:60ch;\">\n    <div class=\"tag gold\">Variable de respuesta<\u002Fdiv>\n    <div class=\"mt-8 body-lg\">Módulo de flexión efectivo. <strong>Objetivo: ~0.1 nN·m<\u002Fstrong> — el orden de magnitud del axón mielinizado.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 11 — Hydrodynamic setup -->\n<section class=\"slide\" data-slide=\"11\">\n  <div class=\"eyebrow\"><span class=\"rule-gold\"><\u002Fspan>05 · Caracterización hidrodinámica<\u002Fdiv>\n  <h2 class=\"title mt-16\">Inyección capilar —<br><em style=\"font-style:italic; color:var(--forest);\">control de presión y velocidad.<\u002Fem><\u002Fh2>\n  <h3 class=\"kicker\">Régimen laminar plenamente desarrollado (Re &lt; 1). El modelo cerrado nos da el caudal óptimo antes de tocar la bomba.<\u002Fh3>\n\n  <div class=\"spread mt-32\">\n    <div>\n      <div class=\"tag\">Montaje experimental<\u002Fdiv>\n      <ul class=\"bullets mt-16\">\n        <li>Jeringa de 5 mL → bomba de infusión, 20–150 mL/h<\u002Fli>\n        <li>Agujas: 100, 250, 400 y 600 µm de diámetro interno<\u002Fli>\n        <li>Etapa motorizada —
