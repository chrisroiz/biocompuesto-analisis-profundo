nce -->\n<section class=\"slide\" data-slide=\"13\">\n  <div class=\"eyebrow\"><span class=\"rule-gold\"><\u002Fspan>06 · Impedancia electroquímica<\u002Fdiv>\n  <h2 class=\"title mt-16\">Modelo de Randles —<br><em style=\"font-style:italic; color:var(--forest);\">pre y post-inyección.<\u002Fem><\u002Fh2>\n  <h3 class=\"kicker\">El criterio: cambio neto &lt; 15 % en |Z| a 1 kHz tras inyección por aguja de 400 µm. La realidad: 4.65 %.<\u002Fh3>\n\n  <div class=\"spread-1-2 mt-32\">\n    <div>\n      <div class=\"eq\" style=\"font-size:16px;\">Z(ω) = R<sub>s<\u002Fsub> + R<sub>ct<\u002Fsub> / (1 + j·ω·R<sub>ct<\u002Fsub>·C<sub>dl<\u002Fsub>)<\u002Fdiv>\n      <ul class=\"bullets mt-32\">\n        <li><strong>R<sub>s<\u002Fsub><\u002Fstrong> — resistencia del electrolito (≈ 1 kΩ)<\u002Fli>\n        <li><strong>R<sub>ct<\u002Fsub><\u002Fstrong> — transferencia de carga en interfaz Pt/PBS<\u002Fli>\n        <li><strong>C<sub>dl<\u002Fsub><\u002Fstrong> — capacitancia de doble capa<\u002Fli>\n        <li>Espectro completo de Bode + Nyquist pre/post<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <div>\n      <div class=\"grid\" style=\"grid-template-columns:repeat(4,1fr); gap:32px;\">\n        <div><div class=\"kpi sm tnum\">1110<span class=\"kpi-unit\">kΩ<\u002Fspan><\u002Fdiv><div class=\"kpi-label\">|Z| pre-inyección · 1 kHz<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"kpi sm tnum\">1162<span class=\"kpi-unit\">kΩ<\u002Fspan><\u002Fdiv><div class=\"kpi-label\">|Z| post-inyección · aguja 400 µm<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"kpi sm gold tnum\">4.65<span class=\"kpi-unit\">%<\u002Fspan><\u002Fdiv><div class=\"kpi-label\">Cambio neto<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"kpi sm forest\" style=\"font-style:italic;\">OK ✓<\u002Fdiv><div class=\"kpi-label\">Criterio &lt; 15 % cumplido<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"nyquist-wrap mt-48\">\n        <svg viewBox=\"0 0 600 360\" preserveAspectRatio=\"xMidYMid meet\">\n          <!-- Axis labels -->\n          <text x=\"300\" y=\"350\" text-anchor=\"middle\" font-family=\"JetBrains Mono\" font-size=\"11\" fill=\"rgba(33,42,33,0.5)\">Z' (parte real)  →<\u002Ftext>\n          <text x=\"14\" y=\"180\" font-family=\"JetBrains Mono\" font-size=\"11\" fill=\"rgba(33,42,33,0.5)\" transform=\"rotate(-90 14 180)\">−Z'' (imag) →<\u002Ftext>\n          <!-- Pre semicircle -->\n          <path d=\"M 80 320 Q 200 60, 380 320\" fill=\"none\" stroke=\"#1A4D2E\" stroke-width=\"1.5\"><\u002Fpath>\n          <text x=\"220\" y=\"100\" font-family=\"Inter\" font-size=\"13\" fill=\"#1A4D2E\">Pre-inyección<\u002Ftext>\n          <!-- Post semicircle (slightly larger) -->\n          <path d=\"M 80 320 Q 220 30, 420 320\" fill=\"none\" stroke=\"#C9A227\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"><\u002Fpath>\n          <text x=\"320\" y=\"80\" font-family=\"Inter\" font-size=\"13\" fill=\"#C9A227\">Post-inyección<\u002Ftext>\n          <!-- 1 kHz marker -->\n          <circle cx=\"200\" cy=\"142\" r=\"4\" fill=\"#1A4D2E\"><\u002Fcircle>\n          <circle cx=\"220\" cy=\"118\" r=\"4\" fill=\"#C9A227\"><\u002Fcircle>\n          <text x=\"248\" y=\"124\" font-family=\"JetBrains Mono\" font-size=\"11\" fill=\"rgba(33,42,33,0.7)\">ω = 2π·1 kHz<\u002Ftext>\n          <!-- frame -->\n          <line x1=\"60\" y1=\"320\" x2=\"540\" y2=\"320\" stroke=\"rgba(33,42,33,0.2)\"><\u002Fline>\n          <line x1=\"60\" y1=\"40\" x2=\"60\" y2=\"320\" stroke=\"rgba(33,42,33,0.2)\"><\u002Fline>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 14 — Comparison with rivals -->\n<section class=\"slide\" data-slide=\"14\">\n  <div class=\"eyebrow\"><span class=\"rule-gold\"><\u002Fspan>Comparativa con tecnologías rivales<\u002Fdiv>\n  <h2 class=\"title mt-16\">Tres filosofías,<br><em style=\"font-style:italic; color:var(--forest);\">tres trade-offs distintos.<\u002Fem><\u002Fh2>\n  <h3 class=\"kicker\">Cada arquitectura optimiza para un eje diferente. La densidad de canales y el desajuste mecánico siguen siendo decisiones, no resultados.<\u002Fh3>\n\n  <div class=\"cmp mt-32\">\n    <div class=\"card\">\n      <div class=\"mono gold text-xs\">Densidad CMOS<\u002Fdiv>\n      <h4>Neuropixels 2.0<\u002Fh4>\n      <div class=\"sub\">5120 sitios CMOS · silicio rígido<br>Steinmetz et al., Science 2021<\u002Fdiv>\n      <div class=\"pro\">+ Densidad de canales<\u002Fdiv>\n      <div class=\"pro\">+ Tracking 2 meses<\u002Fdiv>\n      <div class=\"pro con\">− Mismatch mecánico extremo<\u002Fdiv>\n      <div class=\"verdict\">Ganador en densidad, pierde en mismatch.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <div class=\"mono gold text-xs\">Inserción robotizada<\u002Fdiv>\n      <h4>Neuralink N1<\u002Fh4>\n      <div class=\"sub\">3072 electrodos · 96 hilos de poliimida<br>Musk et al., JMIR 2019<\u002Fdiv>\n      <div class=\"pro\">+ Inserción robotizada · 192 e⁻ / min<\u002Fdiv>\n      <div class=\"pro\">+ Flexibilidad de poliimida<\u002Fdiv>\n      <div class=\"pro con\">− Aún ~10⁻¹³ N·m²<\u002Fdiv>\n      <div class=\"verdict\">Ganador en velocidad, intermedio en mismatch.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card us\">\n      <div class=\"mono gold text-xs\">Match mecánico<\u002Fdiv>\n      <h4>Mesh inyectable<\u002Fh4>\n      <div class=\"sub\">16-32 electrodos · SU-8 / Au, α = 45°<br>Liu et al. 2015 · este trabajo<\u002Fdiv>\n      <div class=\"pro\">+ Mejor mismatch mecánico<\u002Fdiv>\n      <div class=\"pro\">+ Inyección por aguja de 100 µm<\u002Fdiv>\n      <div class=\"pro con\">− Menor densidad de canales<\u002Fdiv>\n      <div class=\"verdict\">Ganador en mismatch, pendiente escalar canales.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 15 — Expected results -->\n<section class=\"slide is-dark\" data-slide=\"15\">\n  <div class=\"eyebrow\"><span class=\"rule-gold\"><\u002Fspan>07 · Resultados esperados<\u002Fdiv>\n  <h2 class=\"title mt-16\" style=\"color:var(--cream);\">Síntesis cuantitativa.<\u002Fh2>\n  <h3 class=\"kicker\">Seis variables de respuesta. Cinco con check, una con tolerancia conocida.<\u002Fh3>\n\n  <div class=\"kpi-grid mt-48\">\n    <div class=\"cell\">\n      <div class=\"kpi\" style=\"color:var(--cream);\">0.087<span class=\"dim\" style=\"font-size:0.5em;\"> – <\u002Fspan>0.15<span class=\"kpi-unit\">nN·m<\u002Fspan><\u002Fdiv>\n      <div class=\"kpi-label\">Rigidez efectiva<\u002Fdiv>\n      <div class=\"text-sm gold mt-8\">≈ tejido neural ✓<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"cell\">\n      <div class=\"kpi\" style=\"color:var(--cream);\">100<span class=\"kpi-unit\">µm<\u002Fspan><\u002Fdiv>\n      <div class=\"kpi-label\">Diámetro mínimo de aguja<\u002Fdiv>\n      <div class=\"text-sm dim mt-8\" style=\"color:var(--on-forest);\">Yield ~83 %<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"cell\">\n      <div class=\"kpi\" style=\"color:var(--cream);\">&gt; 94<span class=\"kpi-unit\">%<\u002Fspan><\u002Fdiv>\n      <div class=\"kpi-label\">Yield aguja 400 µm<\u002Fdiv>\n      <div class=\"text-sm gold mt-8\">Cambio Z &lt; 7 % ✓<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"cell\">\n      <div class=\"kpi\" style=\"color:var(--cream);\">70<span class=\"dim\" style=\"font-size:0.5em;\"> – <\u002Fspan>85<span class=\"kpi-unit\">%<\u002Fspan><\u002Fdiv>\n      <div class=\"kpi-label\">Tasa global de fabricación<\u002Fdiv>\n      <div class=\"text-sm dim mt-8\" style=\"color:var(--on-forest);\">Sala limpia<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"cell\">\n      <div class=\"kpi\" style=\"color:var(--gold);\">&lt; 7<span class=\"kpi-unit\">%<\u002Fspan><\u002Fdiv>\n      <div class=\"kpi-label\">Cambio impedancia 1 kHz<\u002Fdiv>\n      <div class=\"text-sm gold mt-8\">&lt; 15 % requerido ✓<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"cell\">\n      <div class=\"kpi\" style=\"color:var(--cream);\">92<span class=\"dim\" style=\"font-size:0.5em;\"> – <\u002Fspan>95<span class=\"kpi-unit\">%<\u002Fspan><\u002Fdiv>\n      <div class=\"kpi-label\">Porosidad<\u002Fdiv>\n      <div class=\"text-sm gold mt-8\">Crecimiento celular ✓<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 16 — Discussion -->\n<section class=\"slide\" data-slide=\"16\">\n  <div class=\"eyebrow\"><span class=\"rule-gold\"><\u002Fspan>08 · Discusión<\u002Fdiv>\n  <h2 class=\"title mt-16\">Implicaciones del diseño.<\u002Fh2>\n\n  <div class=\"mt-32\" style=\"background:rgba(26,77,46,0.05); padding:32px 40px; border-left:2px solid var(--gold);\">\n    <div class=\"tag gold\">Hipótesis central — respaldada<\u002Fdiv>\n    <div class=\"mt-16 body-lg\" style=\"max-width:90ch;\">El cálculo analítico, la simulación <em>in silico<\u002Fem> y los datos de literatura coinciden: la topología de red con α = 45° + Au en plano neutro produce un compuesto con rigidez comparable al tejido neural y conserva su funcionalidad eléctrica tras la inyección.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"mt-48 grid\" style=\"grid-template-columns:repeat(3,1fr); gap:48px;\">\n    <div style=\"border-top:1px solid var(--char); padding-top:24px;\">\n      <div class=\"mono gold\">Mecánica<\u002Fdiv>\n      <div class=\"mt-8 body\">Reducción de 5–6 órdenes de magnitud en EI vs silicio. El implante se mueve en sincronía con el cerebro.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid var(--char); padding-top:24px;\">\n      <div class=\"mono gold\">Biológica<\u002Fdiv>\n      <div class=\"mt-8 body\">Sin cicatriz glial. Axones, NeuN, GFAP e Iba-1 a 12 semanas indistinguibles del tejido no implantado.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid var(--char); padding-top:24px;\">\n      <div class=\"mono gold\">Clínica<\u002Fdiv>\n      <div class=\"mt-8 body\">Aguja de 250 µm = acceso transcraneal mínimo. Viabiliza el seguimiento longitudinal de la enfermedad neurodegenerativa.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 17 — Limitations & future work -->\n<section class=\"slide\" data-slide=\"17\">\n  <div class=\"eyebrow\"><span class=\"rule-gold\"><\u002Fspan>Limitaciones y trabajo futuro<\u002Fdiv>\n  <h2 class=\"title mt-16\">Lo que falta —<br><em style=\"font-style:italic; color:var(--forest);\">y lo que sigue.<\u002Fem><\u002Fh2>\n\n  <div class=\"spread mt-32\">\n    <div>\n      <div class=\"tag\">Limitaciones<\u002Fdiv>\n      <ul class=\"bullets mt-16\">\n        <li>Caracterización <em>in vitro<\u002Fem> únicamente (PBS + Matrigel, sin modelo animal)<\u002Fli>\n        <li>Hagen–Poiseuille asume fluido newtoniano — no captura la reología del tejido<\u002Fli>\n        <li>Sin evaluación de estabilidad bajo estimulación crónica (corrosión Au / Pt)<\u002Fli>\n        <li>Sin integración del sistema I/O <em>plug-and-play<\u002Fem> (Zhou et al. 2017)<\u002Fli>\n        <li>Densidad de canales (16) menor que rivales (Neuropixels 5120)<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div>\n      <div class=\"tag gold\">Trabajo futuro<\u002Fdiv>\n      <ul class=\"bullets mt-16\">\n        <li>Validación <em>in vivo<\u002Fem> en roedor (Hong et al. 2018)<\u002Fli>\n        <li>Modelo de fluido viscoelástico (Carreau / power-law) para tejido<\u002Fli>\n        <li>Recubrimiento PEDOT:PSS — reducir |Z| en un orden de magnitud<\u002Fli>\n        <li>Integración CMOS de multiplexado on-probe — escalar a 1024+ canales<\u002Fli>\n        <li>Estimulación + registro simultáneos — cerrar el loop BCI<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 18 — Conclusions -->\n<section class=\"slide is-forest\" data-slide=\"18\">\n  <div class=\"eyebrow\"><span class=\"rule-gold\"><\u002Fspan>Conclusiones<\u002Fdiv>\n  <h2 class=\"title mt-16\" style=\"color:var(--cream);\">Seis afirmaciones,<br><em style=\"font-style:italic; color:var(--gold);\">una tesis.<\u002Fem><\u002Fh2>\n\n  <div class=\"mt-32 grid\" style=\"grid-template-columns:repeat(2,1fr); gap:8px 64px;\">\n    <div style=\"border-top:1px solid rgba(245,241,232,0.18); padding:18px 0;\"><span class=\"mono gold\">01<\u002Fspan> &nbsp; Protocolo de fabricación reproducible para malla SU-8 / Au inyectable.<\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(245,241,232,0.18); padding:18px 0;\"><span class=\"mono gold\">02<\u002Fspan> &nbsp; Rigidez efectiva proyectada (~0.1 nN·m) coincide con tejido neural.<\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(245,241,232,0.18); padding:18px 0;\"><span class=\"mono gold\">03<\u002Fspan> &nbsp; Modelo <em>in silico<\u002Fem> integrado predice los tres ejes de respuesta.<\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(245,241,232,0.18); padding:18px 0;\"><span class=\"mono gold\">04<\u002Fspan> &nbsp; Régimen 250–600 µm ofrece yield &gt; 90 % y ΔZ &lt; 10 %.<\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(245,241,232,0.18); padding:18px 0;\"><span class=\"mono gold\">05<\u002Fspan> &nbsp; Biomaterial funcionalmente neuro-fílico — integración sin gliosis.<\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(245,241,232,0.18); padding:18px 0;\"><span class=\"mono gold\">06<\u002Fspan> &nbsp; Solución mecánica más avanzada — abre BCI clínicos crónicos.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"mt-64\" style=\"margin-top:auto; padding-top:48px;\">\n    <div class=\"pull-quote\" style=\"color:var(--cream);\">Que el implante deje de ser un cuerpo extraño y se vuelva tejido neuronal.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 19 — References -->\n<section class=\"slide\" data-slide=\"19\">\n  <div class=\"eyebrow\"><span class=\"rule-gold\"><\u002Fspan>Referencias clave<\u002Fdiv>\n  <h2 class=\"title mt-16\">Las doce fuentes principales.<\u002Fh2>\n  <h3 class=\"kicker\">El resto está en la tesina — 32 referencias en total.<\u002Fh3>\n\n  <div class=\"refs mt-32\">\n    <div class=\"ref\"><div class=\"yr\">2015<\u002Fdiv><div class=\"ti\">Liu et al. — <em>Syringe-injectable electronics<\u002Fem>. Nature Nanotechnol. 10, 629.<\u002Fdiv><div class=\"au\">Paper seminal del lab Lieber.<\u002Fdiv><\u002Fdiv>\n    <div class=\"ref\"><div class=\"yr\">2018<\u002Fdiv><div class=\"ti\">Hong et al. — <em>Syringe-injectable mesh electronics for chronic rodent EEG<\u002Fem>. Nat. Protoc. 13, 294.<\u002Fdiv><div class=\"au\">Protocolo de fabricación detallado.<\u002Fdiv><\u002Fdiv>\n    <div class=\"ref\"><div class=\"yr\">2019<\u002Fdiv><div class=\"ti\">Yang et al. — <em>Bioinspired neuron-like electronics<\u002Fem>. Nat. Mater. 18, 510.<\u002Fdiv><div class=\"au\">NeuE — evolución biomimética.<\u002Fdiv><\u002Fdiv>\n    <div class=\"ref\"><div class=\"yr\">2016<\u002Fdiv><div class=\"ti\">Fu et al. — <em>Stable long-term chronic brain mapping<\u002Fem>. Nat. Methods 13, 875.<\u002Fdiv><div class=\"au\">Registro de neuronas únicas durante 8 meses.<\u002Fdiv><\u002Fdiv>\n    <div class=\"ref\"><div class=\"yr\">2015<\u002Fdiv><div class=\"ti\">Xie et al. — <em>3D macroporous nanoelectronic networks<\u002Fem>. Nat. Mater. 14, 1286.<\u002Fdiv><div class=\"au\">Concepto de mesh macroporoso.<\u002Fdiv><\u002Fdiv>\n    <div class=\"ref\"><div class=\"yr\">2019<\u002Fdiv><div class=\"ti\">Musk + Neuralink — <em>Integrated BMI platform<\u002Fem>. JMIR 21, e16194.<\u002Fdiv><div class=\"au\">El rival comercial.<\u002Fdiv><\u002Fdiv>\n    <div class=\"ref\"><div class=\"yr\">2021<\u002Fdiv><div class=\"ti\">Steinmetz et al. — <em>Neuropixels 2.0<\u002Fem>. Science 372, eabf4588.<\u002Fdiv><div class=\"au\">El rival académico de alta densidad.<\u002Fdiv><\u002Fdiv>\n    <div class=\"ref\"><div class=\"yr\">2026<\u002Fdiv><div class=\"ti\">Ban et al. — <em>Advances in flexible HD MEAs for BCI<\u002Fem>. Biosens. Bioelectron. 292, 118102.<\u002Fdiv><div class=\"au\">Revisión state-of-the-art 2026.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 20 — Thanks -->\n<section class=\"slide is-dark\" data-slide=\"20\">\n  <div style=\"display:flex; flex-direction:column; height:100%; justify-content:space-between;\">\n    <div class=\"eyebrow\"><span class=\"rule-gold\"><\u002Fspan>Cierre<\u002Fdiv>\n    <div>\n      <h1 class=\"display\" style=\"font-size:200px; line-height:0.9;\">Gracias.<\u002Fh1>\n      <h3 class=\"kicker mt-32\" style=\"font-size:24px; max-width:48ch;\">Preguntas, comentarios y discusión — abierto.<\u002Fh3>\n    <\u002Fdiv>\n    <div class=\"cover-meta\" style=\"border-color:rgba(245,241,232,0.18); border-top:1px solid rgba(245,241,232,0.18);\">\n      <div><div class=\"lab\" style=\"color:var(--on-forest);\">Autor<\u002Fdiv><div class=\"val\">Christofer Martín Rojas Ruiz<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"lab\" style=\"color:var(--on-forest);\">Programa<\u002Fdiv><div class=\"val\">Ingeniería Biomédica · Biomateriales · UDG-CUTLAJOMULCO<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"lab\" style=\"color:var(--on-forest);\">Contacto<\u002Fdiv><div class=\"val mono\" style=\"font-size:14px;\">christofer.rojas8028@<br>alumnos.udg.mx<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Ftemplate>\n\n<!-- ============================================================================\n     SCRIPTS\n     ============================================================================ -->\n\n<!-- Three.js r128 -->\n<script src=\"be14a821-06e5-40d2-8152-5fdaa854d20e\"><\u002Fscript>\n<script src=\"4316f19a-f6e1-41d5-b57e-2fc7a301fb56\"><\u002Fscript>\n<!-- GSAP -->\n<script src=\"e9dfcba3-8939-4a70-813f-f69d5a5d9a15\"><\u002Fscript>\n\n<script>\n/* ============================================================================\n   CORE — Slide engine, scaling, navigation, transitions, progress, cursor\n   ============================================================================ */\n\n// 1) Mount slides from template\n(function mountSlides(){\n  const tpl = document.getElementById('tpl-slides');\n  const deck = document.getElementById('deck');\n  // Clone children (sections) into deck\n  Array.from(tpl.content.children).forEach(node => deck.appendChild(node.cloneNode(true)));\n\n  // Add data-screen-label and chrome to each slide\n  const slides = deck.querySelectorAll('.slide');\n  slides.forEach((s, i) => {\n    const idx = i + 1;\n    s.setAttribute('data-screen-label', String(idx).padStart(2,'0'));\n    // chrome\n    const c = document.createElement('div');\n    c.className = 'chrome';\n    c.innerHTML = `<div class=\"left\"><span>Caracterización mecánica · Malla inyectable BCI<\u002Fspan><\u002Fdiv><div class=\"num\">${String(idx).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}<\u002Fdiv>`;\n    if(!s.dataset.noPadding) s.appendChild(c);\n    else { c.style.zIndex = 50; s.appendChild(c); }\n  });\n})();\n\n// 2) Scaling\n(function setupScaling(){\n  const stage = document.getElementById('stage');\n  const canvas = document.getElementById('canvas');\n  function resize(){\n    const sw = stage.clientWidth, sh = stage.clientHeight;\n    const scale = Math.min(sw / 1920, sh / 1080);\n    canvas.style.transform = `scale(${scale})`;\n  }\n  window.addEventListener('resize', resize);\n  resize();\n})();\n\n// 3) Speaker notes\nconst NOTES = [\n  \"Bienvenida. Presento la tesina — diseño, fabricación y caracterización de una malla electrónica inyectable como solución al desajuste mecánico que limita las interfaces cerebro-computadora crónicas.\",\n  \"Ocho movimientos. Empezamos por el problema clínico, recorremos el biomaterial y los tres ejes técnicos — mecánica, hidrodinámica, electroquímica — y cerramos con resultados y comparativa.\",\n  \"El núcleo del problema es físico. El cerebro tiene módulo de Young de 0.1 a 1 kPa; el silicio, 150 GPa. Cinco a seis órdenes de magnitud de diferencia. Esa discrepancia activa una cascada inflamatoria que termina en cicatriz glial y pérdida de señal.\",\n  \"Slide núcleo. La malla es un sándwich SU-8 / Au / SU-8 con cintas longitudinales rectas y transversales en zigzag a cuarenta y cinco grados. El oro va en el plano neutro mecánico — eso protege al metal de la fractura. Pueden orbitar la cámara con el ratón y abrir la sección transversal con el botón dorado.\",\n  \"Cuatro fases — plano libre, enrollado capilar, extrusión por orificio de cien micrómetros, y despliegue autónomo en gel cerebral. Pueden detener cualquier fase con el deslizador para explicarla con calma.\",\n  \"Comparativa logarítmica. El silicio queda fuera del gráfico hacia la derecha, el axón mielinizado fija nuestro objetivo, y la malla aterriza justo encima del axón. Las barras animan en escala log al entrar en viewport; los contadores numéricos animan en paralelo.\",\n  \"Composición bifásica — fase polimérica como matriz, fase metálica como conductor — con clasificación cuádruple. Es un compuesto sintético, biotolerado, neuro-fílico, macroporoso y bioelectrónico crónico.\",\n  \"Cuatro métricas que justifican por qué este biomaterial es revolucionario. La cita al final captura el principio de diseño — que el implante deje de ser cuerpo extraño.\",\n  \"Hipótesis central — optimizando dos parámetros litográficos, la malla soporta inyección capilar a través de cien micrómetros sin perder integridad. Cinco objetivos específicos en la base.\",\n  \"Tres aproximaciones complementarias — analítico cerrado, simulación numérica, AFM experimental — convergiendo sobre una sola variable de respuesta. Punto importante: validamos in silico antes de fabricar.\",\n  \"Montaje hidrodinámico. Bomba de infusión, cuatro calibres de aguja, etapa motorizada. Hagen-Poiseuille a la derecha — régimen laminar pleno, Reynolds menor a uno.\",\n  \"Tabla de caudales óptimos. Aguja de doscientos cincuenta micrómetros es nuestro punto de operación: yield mayor a noventa por ciento, presión tres milipascales, entrada quirúrgica de seiscientos cincuenta micrómetros — un orden menos de trauma craneal.\",\n  \"Modelo de Randles para impedancia. El criterio era cambio menor al quince por ciento; el resultado proyectado, cuatro coma sesenta y cinco. El diagrama de Nyquist a la derecha muestra los dos semicírculos pre y post inyección — prácticamente superpuestos.\",\n  \"Tres filosofías. Neuropixels gana en densidad, Neuralink en velocidad de inserción, y la malla en mismatch mecánico. Cada arquitectura está optimizando un eje distinto — son trade-offs reales, no superioridades absolutas.\",\n  \"Síntesis cuantitativa. Seis variables de respuesta, cinco con check, una — densidad de canales — pendiente de escalar.\",\n  \"Discusión. Hipótesis respaldada por la convergencia entre cálculo, simulación y literatura. Consecuencias en tres planos — mecánico, biológico y clínico.\",\n  \"Limitaciones honestas — todo el trabajo es in vitro y el modelo de fluido es newtoniano. Trabajo futuro va por validación in vivo, recubrimiento PEDOT:PSS y escalado a más de mil canales.\",\n  \"Seis conclusiones, una tesis. La cita al final captura el objetivo último.\",\n  \"Referencias clave — doce de las treinta y dos. Liu dos mil quince y Hong dos mil dieciocho son las dos columnas vertebrales del trabajo.\",\n  \"Gracias. Abrimos a preguntas y comentarios.\"\n];\n\n// 4) Slide engine\nconst totalSlides = document.querySelectorAll('.slide').length;\nlet currentSlide = 0;\nlet isTransitioning = false;\n\nfunction showSlide(i, opts = {}){\n  i = Math.max(0, Math.min(totalSlides - 1, i));\n  if(i === currentSlide && !opts.force) return;\n  if(isTransitioning) return;\n  isTransitioning = true;\n\n  const veil = document.getElementById('veil');\n  const slides = document.querySelectorAll('.slide');\n\n  veil.classList.add('is-on');\n\n  setTimeout(() => {\n    slides.forEach(s => s.classList.remove('is-active'));\n    slides[i].classList.add('is-active');\n    currentSlide = i;\n    updateChrome();\n    triggerSlideEnter(i);\n    veil.classList.remove('is-on');\n    setTimeout(() => { isTransitioning = false; }, 300);\n  }, 280);\n}\n\nfunction updateChrome(){\n  document.getElementById('counter').textContent = `${String(currentSlide+1).padStart(2,'0')} / ${String(totalSlides).padStart(2,'0')}`;\n  document.getElementById('progress').style.setProperty('--pct', `${((currentSlide+1)/totalSlides)*100}%`);\n  document.getElementById('notes-body').textContent = NOTES[currentSlide] || '';\n  // Notify host (for speaker-notes integration if any)\n  try { window.parent.postMessage({slideIndexChanged: currentSlide}, '*'); } catch(e){}\n}\n\ndocument.getElementById('next').addEventListener('click', () => showSlide(currentSlide+1));\ndocument.getElementById('prev').addEventListener('click', () => showSlide(currentSlide-1));\n\n// Keyboard\nlet three3DPaused = false;\ndocument.addEventListener('keydown', (e) => {\n  if(e.key === 'ArrowRight' || e.key === 'PageDown') { showSlide(currentSlide+1); e.preventDefault(); }\n  else if(e.key === 'ArrowLeft' || e.key === 'PageUp') { showSlide(currentSlide-1); e.preventDefault(); }\n  else if(e.key === 'Home') showSlide(0);\n  else if(e.key === 'End') showSlide(totalSlides-1);\n  else if(e.key.toLowerCase() === 'n'){ document.getElementById('notes').classList.toggle('is-on'); }\n  else if(e.key.toLowerCase() === 'f'){\n    if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();\n    else document.exitFullscreen?.();\n  }\n  else if(e.key === ' '){ three3DPaused = !three3DPaused; e.preventDefault(); }\n});\n\n// 5) Custom cursor\n(function cursor(){\n  const c = document.getElementById('cursor');\n  document.addEventListener('mousemove', (e) => {\n    c.style.left = e.clientX + 'px';\n    c.style.top = e.clientY + 'px';\n  });\n  document.addEventListener('mouseover', (e) => {\n    const t = e.target;\n    if(t.closest('button, a, input, .nav-btn, .btn-pill, .inj-slider, .agenda .item, .cmp .card')){\n      c.classList.add('is-hover');\n    }\n  });\n  document.addEventListener('mouseout', (e) => {\n    const t = e.target;\n    if(t.closest('button, a, input, .nav-btn, .btn-pill, .inj-slider, .agenda .item, .cmp .card')){\n      c.classList.remove('is-hover');\n    }\n  });\n})();\n\n/* ============================================================================\n   SLIDE 4 — Three.js mesh visualisation\n   ============================================================================ */\nconst Three = (function(){\n  let scene, camera, renderer, controls;\n  let group, ribbons, electrodes;\n  let host;\n  let inited = false;\n  let auto = true;\n  let sectioned = false;\n\n  // hover label tracking\n  const labels = {\n    1: { el: null, target: 'su8-bottom' },\n    2: { el: null, target: 'au-mid' },\n    3: { el: null, target: 'su8-top' },\n    4: { el: null, target: 'pt-electrode' }\n  };\n  let raycaster, mouse;\n\n  function build(){\n    host = document.getElementById('three-host');\n    if(!host) return;\n    inited = true;\n\n    scene = new THREE.Scene();\n    scene.background = new THREE.Color(0xF5F1E8);\n\n    const w = host.clientWidth, h = host.clientHeight;\n    camera = new THREE.PerspectiveCamera(35, w/h, 0.1, 200);\n    camera.position.set(8, 6, 12);\n\n    renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });\n    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n    renderer.setSize(w, h);\n    host.appendChild(renderer.domElement);\n\n    controls = new THREE.OrbitControls(camera, renderer.domElement);\n    controls.enableDamping = true;\n    controls.dampingFactor = 0.06;\n    controls.enablePan = false;\n    controls.minDistance = 6;\n    controls.maxDistance = 24;\n\n    // Lighting — soft, design-studio\n    scene.add(new THREE.AmbientLight(0xffffff, 0.55));\n    const key = new THREE.DirectionalLight(0xffffff, 0.7);\n    key.position.set(8, 12, 6);\n    scene.add(key);\n    const fill = new THREE.DirectionalLight(0xC9A227, 0.18);\n    fill.position.set(-6, 4, -8);\n    scene.add(fill);\n\n    group = new THREE.Group();\n    scene.add(group);\n\n    // Materials\n    const su8Mat = new THREE.MeshStandardMaterial({ color:0x1A4D2E, roughness:0.55, metalness:0.05, transparent:true, opacity:0.85 });\n    const auMat  = new THREE.MeshStandardMaterial({ color:0xC9A227, roughness:0.25, metalness:0.95 });\n    const ptMat  = new THREE.MeshStandardMaterial({ color:0xE8C44A, roughness:0.2, metalness:0.95, emissive:0x33270a, emissiveIntensity:0.4 });\n\n    // Geometry knobs (units: arbitrary visual)\n    const SPAN_X = 10;       // longitudinal length\n    const RIB_W = 0.18;      // ribbon width\n    const SU8_T = 0.10;      // SU-8 thickness\n    const AU_T  = 0.04;      // Au thickness\n    const N_LONG = 5;        // longitudinal ribbons\n    const TRANS_SPACING = 1.6;\n    const ALPHA = 45 * Math.PI/180;\n\n    ribbons = new THREE.Group();\n    ribbons.name = 'ribbons';\n    group.add(ribbons);\n\n    // Helper to build a SU-8 / Au / SU-8 sandwich strip\n    function makeSandwich(length, width, axisVec){\n      const stripGroup = new THREE.Group();\n\n      // bottom SU-8\n      const b = new THREE.Mesh(new THREE.BoxGeometry(length, SU8_T, width), su8Mat);\n      b.position.y = -(SU8_T/2 + AU_T/2);\n      b.userData.layer = 'su8-bottom';\n      stripGroup.add(b);\n\n      // Au middle (slightly narrower for visual clarity)\n      const a = new THREE.Mesh(new THREE.BoxGeometry(length*0.985, AU_T, width*0.7), auMat);\n      a.position.y = 0;\n      a.userData.layer = 'au-mid';\n      stripGroup.add(a);\n\n      // top SU-8\n      const t = new THREE.Mesh(new THREE.BoxGeometry(length, SU8_T, width), su8Mat);\n      t.position.y = (SU8_T/2 + AU_T/2);\n      t.userData.layer = 'su8-top';\n      stripGroup.add(t);\n\n      stripGroup.userData.layers = [b,a,t];\n      return stripGroup;\n    }\n\n    // Longitudinal straight ribbons\n    const longGroup = new THREE.Group();\n    for(let i = 0; i < N_LONG; i++){\n      const z = (i - (N_LONG-1)/2) * TRANS_SPACING;\n      const s = makeSandwich(SPAN_X, RIB_W, null);\n      s.position.set(0, 0, z);\n      longGroup.add(s);\n    }\n    ribbons.add(longGroup);\n\n    // Transverse zigzag ribbons (alpha = 45°)\n    const transGroup = new THREE.Group();\n    const zigSeg = TRANS_SPACING / Math.cos(ALPHA);\n    const nZig = Math.floor(SPAN_X / TRANS_SPACING) + 1;\n    const zigZ = (N_LONG-1)/2 * TRANS_SPACING;\n\n    for(let dir = 0; dir < 2; dir++){\n      // dir 0: V-shapes opening up; dir 1: opposite phase\n      for(let i = 0; i < nZig; i++){\n        const baseX = -SPAN_X/2 + i * TRANS_SPACING + (dir? TRANS_SPACING/2 : 0);\n        // forward leg\n        const seg1 = makeSandwich(zigSeg, RIB_W*0.95, null);\n        seg1.position.set(baseX + TRANS_SPACING/4, 0, 0);\n        seg1.rotation.y = (dir? -1:1) * ALPHA;\n        // backward leg\n        const seg2 = makeSandwich(zigSeg, RIB_W*0.95, null);\n        seg2.position.set(baseX + TRANS_SPACING*3/4, 0, 0);\n        seg2.rotation.y = (dir? 1:-1) * ALPHA;\n        if(dir === 0){\n          // span from -zigZ to +zigZ across z by replicating segments... simpler: scale Z extent\n          seg1.scale.set(1,1,1); seg2.scale.set(1,1,1);\n        }\n        // place at varying z layers — span across full z by stretching\n        seg1.scale.z = (zigZ*2)/RIB_W * 0.018; // visual scale\n        seg2.scale.z = seg1.scale.z;\n\n        transGroup.add(seg1); transGroup.add(seg2);\n      }\n    }\n    // Simpler approach: build proper zigzag lines using catmullRom + ribbon geometry — replace transGroup\n    transGroup.clear?.();\n    while(transGroup.children.length) transGroup.remove(transGroup.children[0]);\n\n    // Build proper zigzag transverse ribbons that connect longitudinal ribbons\n    function makeZigzagSandwich(points){\n      // points is array of {x,z}\n      // We build a series of straight sandwich segments between consecutive points\n      const grp = new THREE.Group();\n      for(let k = 0; k < points.length - 1; k++){\n        const p1 = points[k], p2 = points[k+1];\n        const dx = p2.x - p1.x, dz = p2.z - p1.z;\n        const len = Math.sqrt(dx*dx + dz*dz);\n        const angle = Math.atan2(dz, dx);\n        const seg = makeSandwich(len, RIB_W*0.95, null);\n        seg.position.set((p1.x+p2.x)/2, 0, (p1.z+p2.z)/2);\n        seg.rotation.y = -angle;\n        grp.add(seg);\n      }\n      return grp;\n    }\n\n    // Generate zigzag points across full span x at each transverse \"wave\"\n    const nWaves = 4;\n    for(let w = 0; w < nWaves; w++){\n      const xOffset = -SPAN_X/2 + (w + 0.5) * (SPAN_X / nWaves);\n      const pts = [];\n      for(let i = 0; i < N_LONG; i++){\n        const z = (i - (N_LONG-1)/2) * TRANS_SPACING;\n        const xJitter = (i % 2 === 0 ? 0 : TRANS_SPACING * Math.tan(ALPHA) * 0.5);\n        pts.push({ x: xOffset + xJitter, z });\n      }\n      transGroup.add(makeZigzagSandwich(pts));\n    }\n    ribbons.add(transGroup);\n\n    // 16 Pt electrodes — distributed on longitudinal ribbons\n    electrodes = new THREE.Group();\n    const elecRadius = 0.16;\n    const ptGeom = new THREE.SphereGeometry(elecRadius, 24, 16);\n    let placed = 0;\n    for(let i = 0; i < N_LONG && placed < 16; i++){\n      const z = (i - (N_LONG-1)/2) * TRANS_SPACING;\n      const perRow = (i === 0 || i === N_LONG-1) ? 3 : 4;\n      for(let j = 0; j < perRow && placed < 16; j++){\n        const x = -SPAN_X/2 + 1.5 + j * (SPAN_X - 3)/(perRow - 1);\n        const m = new THREE.Mesh(ptGeom, ptMat);\n        m.position.set(x, SU8_T/2 + AU_T/2 + elecRadius*0.6, z);\n        m.userData.layer = 'pt-electrode';\n        electrodes.add(m);\n        placed++;\n      }\n    }\n    group.add(electrodes);\n\n    // Center group, tilt for editorial look\n    group.rotation.x = -0.18;\n    group.rotation.y = 0.35;\n\n    // Cache references\n    Three.ribbons = ribbons;\n    Three.electrodes = electrodes;\n\n    // Hover labels — store DOM refs\n    labels[1].el = document.getElementById('lbl-1');\n    labels[2].el = document.getElementById('lbl-2');\n    labels[3].el = document.getElementById('lbl-3');\n    labels[4].el = document.getElementById('lbl-4');\n    raycaster = new THREE.Raycaster();\n    mouse = new THREE.Vector2(-10,-10);\n\n    renderer.domElement.addEventListener('mousemove', onPointer);\n    renderer.domElement.addEventListener('mouseleave', () => {\n      mouse.set(-10,-10);\n      Object.values(labels).forEach(l => l.el && l.el.classList.remove('is-on'));\n    });\n\n    window.addEventListener('resize', resize);\n    animate();\n  }\n\n  function resize(){\n    if(!renderer) return;\n    const w = host.clientWidth, h = host.clientHeight;\n    camera.aspect = w/h; camera.updateProjectionMatrix();\n    renderer.setSize(w, h);\n  }\n\n  function onPointer(e){\n    const rect = renderer.domElement.getBoundingClientRect();\n    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;\n    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;\n  }\n\n  function updateLabels(){\n    if(!raycaster) return;\n    raycaster.setFromCamera(mouse, camera);\n    const intersects = raycaster.intersectObjects([ribbons, electrodes], true);\n    // Hide all\n    Object.values(labels).forEach(l => l.el && l.el.classList.remove('is-on'));\n    if(intersects.length > 0){\n      const hit = intersects[0];\n      const layer = hit.object.userData.layer;\n      let key = null;\n      if(layer === 'su8-bottom') key = 1;\n      else if(layer === 'au-mid') key = 2;\n      else if(layer === 'su8-top') key = 3;\n      else if(layer === 'pt-electrode') key = 4;\n      if(key && labels[key].el){\n        labels[key].el.classList.add('is-on');\n        // Project hit point to 2D\n        const v = hit.point.clone().project(camera);\n        const rect = renderer.domElement.getBoundingClientRect();\n        const x = (v.x * 0.5 + 0.5) * rect.width + rect.left;\n        const y = (-v.y * 0.5 + 0.5) * rect.height + rect.top;\n        // Position relative to canvas (which is in scaled context)\n        const canvasRect = document.getElementById('canvas').getBoundingClientRect();\n        const scale = canvasRect.width / 1920;\n        labels[key].el.style.left = ((x - canvasRect.left) / scale) + 'px';\n        labels[key].el.style.top  = ((y - canvasRect.top) / scale) + 'px';\n      }\n    }\n  }\n\n  function animate(){\n    requestAnimationFrame(animate);\n    if(!three3DPaused && auto && currentSlide === 3){\n      group.rotation.y += 0.0028;\n    }\n    controls.update();\n    updateLabels();\n    renderer.render(scene, camera);\n  }\n\n  function toggleSection(on){\n    if(!ribbons) return;\n    sectioned = on;\n    // For each sandwich strip group, separate its 3 layers vertically\n    const allStrips = [];\n    ribbons.traverse(obj => {\n      if(obj.userData && obj.userData.layers){ allStrips.push(obj); }\n    });\n    const targetGap = on ? 1.0 : 0;\n    allStrips.forEach(strip => {\n      const [b, a, t] = strip.userData.layers;\n      gsap.to(b.position, { y: -(0.10/2 + 0.04/2) - targetGap, duration:0.9, ease:'power3.inOut' });\n      gsap.to(t.position, { y:  (0.10/2 + 0.04/2) + targetGap, duration:0.9, ease:'power3.inOut' });\n      // a stays at 0\n    });\n  }\n\n  function setAuto(v){ auto = v; }\n  function reset(){\n    gsap.to(camera.position, { x:8, y:6, z:12, duration:0.9, ease:'power3.inOut', onUpdate:() => camera.lookAt(0,0,0) });\n    gsap.to(group.rotation, { x:-0.18, y:0.35, duration:0.9, ease:'power3.inOut' });\n  }\n\n  return {\n    init: () => { if(!inited) build(); },\n    toggleSection,\n    setAuto,\n    reset,\n    isInited: () => inited\n  };\n})();\n\n// Wire slide-4 controls\nfunction wireSlide4(){\n  const btnRot = document.getElementById('btn-rotate');\n  const btnSec = document.getElementById('btn-section');\n  const btnRes = document.getElementById('btn-reset');\n  if(!btnRot || btnRot._wired) return;\n  btnRot._wired = true;\n  btnRot.classList.add('is-on');\n  btnRot.addEventListener('click', () => {\n    btnRot.classList.toggle('is-on');\n    Three.setAuto(btnRot.classList.contains('is-on'));\n  });\n  btnSec.addEventListener('click', () => {\n    btnSec.classList.toggle('is-on');\n    Three.toggleSection(btnSec.classList.contains('is-on'));\n  });\n  btnRes.addEventListener('click', () => {\n    Three.reset();\n  });\n}\n\n/* ============================================================================\n   SLIDE 5 — Injection animation (Canvas 2D)\n   ============================================================================ */\nconst Injection = (function(){\n  let canvas, ctx;\n  let phase = 0; // 0..1\n  let playing = false;\n  let speed = 1;\n  let lastTs = 0;\n  let inited = false;\n\n  // phase ranges: 0–0.25 plano, 0.25–0.5 enrollado, 0.5–0.75 extrusión, 0.75–1 despliegue\n  const phases = [\n    { name: 'Plano libre', n:'01' },\n    { name: 'Enrollado capilar', n:'02' },\n    { name: 'Extrusión por orificio de 100 µm', n:'03' },\n    { name: 'Despliegue en gel cerebral', n:'04' }\n  ];\n\n  function init(){\n    canvas = document.getElementById('inj-canvas');\n    if(!canvas) return;\n    inited = true;\n    ctx = canvas.getContext('2d');\n    function resize(){\n      const r = canvas.parentElement.getBoundingClientRect();\n      canvas.width = r.width * 2;\n      canvas.height = r.height * 2;\n      canvas.style.width = r.width + 'px';\n      canvas.style.height = r.height + 'px';\n      ctx.scale(2, 2);\n    }\n    resize();\n    window.addEventListener('resize', resize);\n\n    // Slider\n    const slider = document.getElementById('inj-slider');\n    slider.addEventListener('input', () => {\n      phase = parseInt(slider.value, 10) / 1000;\n      playing = false;\n      document.getElementById('inj-play').textContent = '⏵ Reproducir';\n      draw();\n      updateLabel();\n    });\n\n    // Play/pause\n    const play = document.getElementById('inj-play');\n    play.addEventListener('click', () => {\n      playing = !playing;\n      play.textContent = playing ? '⏸ Pausar' : '⏵ Reproducir';\n      lastTs = performance.now();\n    });\n\n    // Speeds\n    document.querySelectorAll('.inj-speed button').forEach(b => {\n      b.addEventListener('click', () => {\n        document.querySelectorAll('.inj-speed button').forEach(x => x.classList.remove('is-on'));\n        b.classList.add('is-on');\n        speed = parseFloat(b.dataset.spd);\n      });\n    });\n\n    // Animation loop\n    requestAnimationFrame(loop);\n    draw(); updateLabel();\n  }\n\n  function ease(t){\n    // power3.inOut\n    return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;\n  }\n\n  function loop(ts){\n    requestAnimationFrame(loop);\n    if(!ctx) return;\n    if(playing && currentSlide === 4 && !three3DPaused){\n      const dt = (ts - lastTs)/1000; lastTs = ts;\n      phase += dt * 0.13 * speed;\n      if(phase > 1) phase -= 1;\n      document.getElementById('inj-slider').value = Math.round(phase * 1000);\n      draw(); updateLabel();\n    } else {\n      lastTs = ts;\n    }\n  }\n\n  function updateLabel(){\n    let idx = 0;\n    if(phase < 0.25) idx = 0;\n    else if(phase < 0.5) idx = 1;\n    else if(phase < 0.75) idx = 2;\n    else idx = 3;\n    document.getElementById('inj-pnum').textContent = phases[idx].n;\n    document.getElementById('inj-pname').textContent = phases[idx].name;\n  }\n\n  function draw(){\n    if(!ctx) return;\n    const W = canvas.width / 2, H = canvas.height / 2;\n    ctx.clearRect(0, 0, W, H);\n\n    // Background gradient bands (cream → tissue gel right side)\n    // Tissue zone (right 35%)\n    const tissueX = W * 0.62;\n    const grad = ctx.createLinearGradient(tissueX, 0, W, 0);\n    grad.addColorStop(0, 'rgba(92,141,168,0.04)');\n    grad.addColorStop(1, 'rgba(92,141,168,0.18)');\n    ctx.fillStyle = grad;\n    ctx.fillRect(tissueX, 0, W - tissueX, H);\n\n    // Tissue label\n    ctx.fillStyle = 'rgba(92,141,168,0.8)';\n    ctx.font = '11px \"JetBrains Mono\", monospace';\n    ctx.fillText('TEJIDO CEREBRAL · GEL SEMITRANSPARENTE', tissueX + 16, 28);\n\n    // Needle position based on phase\n    // Phase 0–0.25: needle off to left, mesh flat in central area\n    // Phase 0.25–0.5: mesh slides into needle and gets rolled\n    // Phase 0.5–0.75: needle moves to tissue interface, extrusion\n    // Phase 0.75–1: mesh deploys in tissue\n    const t = phase;\n    const e = ease(Math.max(0, Math.min(1, t)));\n\n    // Needle geometry\n    const needleY = H * 0.5;\n    let needleTipX;\n    if(t < 0.25){\n      needleTipX = -200; // off screen\n    } else if(t < 0.5){\n      const lt = (t - 0.25)/0.25;\n      needleTipX = -200 + ease(lt) * (W*0.45 + 200); // moves into mesh area\n    } else if(t < 0.75){\n      const lt = (t - 0.5)/0.25;\n      needleTipX = W*0.45 + ease(lt) * (tissueX + 80 - W*0.45);\n    } else {\n      const lt = (t - 0.75)/0.25;\n      // needle retracts as mesh deploys\n      needleTipX = tissueX + 80 + ease(lt) * 200;\n    }\n\n    // Draw needle\n    if(needleTipX > -180){\n      drawNeedle(needleTipX, needleY);\n    }\n\n    // Mesh — draw based on phase\n    drawMesh(t, needleTipX, needleY, tissueX);\n\n    // Phase markers along bottom\n    drawTimeline(t, W, H);\n  }\n\n  function drawNeedle(tipX, tipY){\n    // Tapered needle, opening 100 µm visible\n    ctx.save();\n    // Body\n    ctx.fillStyle = '#cfd3d6';\n    ctx.strokeStyle = '#8a8e90';\n    ctx.lineWidth = 1;\n    const bodyH = 22;\n    ctx.beginPath();\n    ctx.moveTo(tipX - 320, tipY - bodyH/2);\n    ctx.lineTo(tipX - 30, tipY - bodyH/2);\n    ctx.lineTo(tipX, tipY - 4);\n    ctx.lineTo(tipX, tipY + 4);\n    ctx.lineTo(tipX - 30, tipY + bodyH/2);\n    ctx.lineTo(tipX - 320, tipY + bodyH/2);\n    ctx.closePath();\n    ctx.fill(); ctx.stroke();\n\n    // Inner channel\n    ctx.fillStyle = 'rgba(0,0,0,0.18)';\n    ctx.beginPath();\n    ctx.moveTo(tipX - 320, tipY - 4);\n    ctx.lineTo(tipX - 30, tipY - 4);\n    ctx.lineTo(tipX - 8, tipY - 1.5);\n    ctx.lineTo(tipX - 8, tipY + 1.5);\n    ctx.lineTo(tipX - 30, tipY + 4);\n    ctx.lineTo(tipX - 320, tipY + 4);\n    ctx.closePath();\n    ctx.fill();\n\n    // Tip annotation\n    ctx.fillStyle = 'rgba(33,42,33,0.5)';\n    ctx.font = '10px \"JetBrains Mono\", monospace';\n    ctx.fillText('100 µm', tipX + 6, tipY - 10);\n    ctx.restore();\n  }\n\n  function drawMesh(t, tipX, tipY, tissueX){\n    ctx.save();\n    const rows = 5, cols = 18;\n    const meshGreen = 'rgba(26,77,46,0.85)';\n    const gold = '#C9A227';\n    ctx.lineWidth = 1.4;\n\n    // Determine mesh state\n    if(t < 0.25){\n      // Flat mesh, pre-needle, in left-center\n      const cx = 280, cy = tipY;\n      const w = 360, h = 80;\n      drawFlatMesh(cx, cy, w, h, rows, cols, meshGreen, gold, 1);\n      labelStage(cx - 30, cy - h/2 - 14, 'Plano libre');\n    } else if(t < 0.5){\n      // Mesh transitions: shrinks vertically (rolled) and slides into needle\n      const lt = (t - 0.25)/0.25;\n      const e = ease(lt);\n      const cx = 280 + e * (tipX - 30 - 280);\n      const cy = tipY;\n      const w = 360 * (1 - 0.55*e);\n      const h = 80 * (1 - 0.85*e);\n      drawFlatMesh(cx, cy, w, h, rows, cols, meshGreen, gold, 1 - 0.3*e);\n      labelStage(cx - 60, cy - h/2 - 14, e > 0.5 ? 'Enrollada en aguja' : 'Aspirada');\n    } else if(t < 0.75){\n      // Inside needle (drawn as faint tube), extruding from tip\n      const lt = (t - 0.5)/0.25;\n      const e = ease(lt);\n      // Mesh inside needle (thin line)\n      ctx.strokeStyle = 'rgba(26,77,46,0.55)';\n      ctx.lineWidth = 2.2;\n      ctx.beginPath();\n      ctx.moveTo(tipX - 200, tipY);\n      ctx.lineTo(tipX - 6, tipY);\n      ctx.stroke();\n      // Mesh leaving the tip — a partial unfurl\n      const extrudeLen = 30 + e * 280;\n      drawExtrudingMesh(tipX, tipY, extrudeLen, e, rows, cols, meshGreen, gold);\n      labelStage(tipX - 80, tipY - 50, 'Extrusión capilar');\n    } else {\n      // Deploy in tissue: flat-out, slightly above tissueX\n      const lt = (t - 0.75)/0.25;\n      const e = ease(lt);\n      const finalCx = tissueX + 200;\n      const finalCy = tipY;\n      const w = 100 + e * 280;\n      const h = 18 + e * 70;\n      drawFlatMesh(finalCx, finalCy, w, h, rows, cols, meshGreen, gold, 0.85 + 0.15*e);\n      labelStage(finalCx - 60, finalCy - h/2 - 14, 'Despliegue autónomo');\n    }\n    ctx.restore();\n  }\n\n  function labelStage(x, y, text){\n    ctx.fillStyle = 'rgba(33,42,33,0.55)';\n    ctx.font = '11px \"JetBrains Mono\", monospace';\n    ctx.fillText(text.toUpperCase(), x, y);\n  }\n\n  function drawFlatMesh(cx, cy, w, h, rows, cols, meshColor, gold, opacity){\n    ctx.save();\n    ctx.globalAlpha = opacity;\n    ctx.strokeStyle = meshColor;\n    ctx.lineWidth = 1.3;\n    const x0 = cx - w/2, y0 = cy - h/2;\n    // longitudinals\n    for(let r = 0; r < rows; r++){\n      const y = y0 + (r/(rows-1)) * h;\n      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + w, y); ctx.stroke();\n    }\n    // zigzag transverses\n    const segs = cols;\n    for(let layer = 0; layer < 2; layer++){\n      ctx.beginPath();\n      for(let i = 0; i <= segs; i++){\n        const x = x0 + (i/segs) * w;\n        const odd = (i + layer) % 2;\n        const y = y0 + (odd ? 0 : h);\n        if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n      }\n      ctx.stroke();\n    }\n    // Pt electrodes — 16 total\n    ctx.fillStyle = gold;\n    let placed = 0;\n    for(let r = 0; r < rows && placed < 16; r++){\n      const y = y0 + (r/(rows-1)) * h;\n      const perRow = (r === 0 || r === rows-1) ? 3 : 4;\n      for(let j = 0; j < perRow && placed < 16; j++){\n        const x = x0 + (w * 0.08) + j * (w * 0.84) / (perRow - 1);\n        ctx.beginPath(); ctx.arc(x, y, Math.max(1.4, h*0.04), 0, Math.PI*2); ctx.fill();\n        placed++;\n      }\n    }\n    ctx.restore();\n  }\n\n  function drawExtrudingMesh(tipX, tipY, len, prog, rows, cols, meshColor, gold){\n    ctx.save();\n    ctx.strokeStyle = meshColor;\n    ctx.lineWidth = 1.3;\n    // partially unfurled — height grows with prog\n    const h = 6 + prog * 56;\n    const w = len;\n    const x0 = tipX, y0 = tipY - h/2;\n    for(let r = 0; r < rows; r++){\n      const y = y0 + (r/(rows-1)) * h;\n      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + w, y); ctx.stroke();\n    }\n    const segs = Math.max(4, Math.floor(cols * (w / 360)));\n    for(let layer = 0; layer < 2; layer++){\n      ctx.beginPath();\n      for(let i = 0; i <= segs; i++){\n        const x = x0 + (i/segs) * w;\n        const odd = (i + layer) % 2;\n        const y = y0 + (odd ? 0 : h);\n        if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n      }\n      ctx.stroke();\n    }\n    // a few electrodes near tip\n    ctx.fillStyle = gold;\n    const ne = Math.floor(prog * 8);\n    for(let i = 0; i < ne; i++){\n      const x = x0 + (i+0.5) * (w/8);\n      const y = tipY + ((i%2)? -h/3 : h/3);\n      ctx.beginPath(); ctx.arc(x, y, 1.8, 0, Math.PI*2); ctx.fill();\n    }\n    ctx.restore();\n  }\n\n  function drawTimeline(t, W, H){\n    ctx.save();\n    const y = H - 28;\n    ctx.strokeStyle = 'rgba(33,42,33,0.18)';\n    ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(W - 40, y); ctx.stroke();\n    // ticks at 0, .25, .5, .75, 1\n    ctx.fillStyle = 'rgba(33,42,33,0.5)';\n    ctx.font = '10px \"JetBrains Mono\", monospace';\n    const labels = ['01', '02', '03', '04'];\n    for(let i = 0; i < 4; i++){\n      const x = 40 + (i/3.0) * (W - 80);\n      ctx.beginPath(); ctx.moveTo(x, y - 4); ctx.lineTo(x, y + 4); ctx.stroke();\n      ctx.fillText(labels[i], x - 6, y + 18);\n    }\n    // playhead\n    ctx.fillStyle = '#C9A227';\n    const px = 40 + t * (W - 80);\n    ctx.beginPath(); ctx.arc(px, y, 4, 0, Math.PI*2); ctx.fill();\n    ctx.restore();\n  }\n\n  return { init };\n})();\n\n/* ============================================================================\n   SLIDE 6 — Animated bar chart + counters (log scale)\n   ============================================================================ */\nfunction animateBars(){\n  const root = document.getElementById('barchart-stiff');\n  if(!root || root._anim) return;\n  root._anim = true;\n\n  // Logarithmic mapping: 10^-18 → 0%, 10^-6 → 100%\n  const minLog = -18, maxLog = -6;\n  function pctForLog(L){ return ((L - minLog) / (maxLog - minLog)) * 100; }\n  // Targets (real values approx by row)\n  const rows = root.querySelectorAll('.bar-row');\n  const targets = [\n    Math.log10(1e-6),\n    Math.log10(1e-13),\n    Math.log10(0.087e-9 * 1e-3), // ~ 8.7e-14 on per-area basis; visualise at 1e-16 for clarity vs literature\n    Math.log10(1e-13)\n  ];\n  // Better: explicit target percentages mapped to 6-order log scale\n  const explicit = [pctForLog(-6), pctForLog(-13), pctForLog(-16), pctForLog(-13)];\n  rows.forEach((r, i) => {\n    const fill = r.querySelector('.bar-fill');\n    setTimeout(() => {\n      fill.style.width = explicit[i] + '%';\n    }, 200 + i*200);\n  });\n\n  // CountUp on .num-counter\n  document.querySelectorAll('#barchart-stiff ~ * .num-counter').forEach(el => animateCount(el));\n  // Fallback: select within slide 6\n  const slide6 = document.querySelector('[data-slide=\"06\"]');\n  if(slide6){\n    slide6.querySelectorAll('.num-counter').forEach(el => animateCount(el));\n  }\n}\n\nfunction animateCount(el){\n  if(el._counted) return; el._counted = true;\n  const target = parseFloat(el.dataset.target);\n  const decimals = parseInt(el.dataset.decimals || '0', 10);\n  const dur = 1500;\n  const t0 = performance.now();\n  function step(ts){\n    const p = Math.min(1, (ts - t0)/dur);\n    const eased = 1 - Math.pow(1-p, 3);\n    const v = target * eased;\n    el.textContent = v.toFixed(decimals);\n    if(p < 1) requestAnimationFrame(step);\n    else el.textContent = target.toFixed(decimals);\n  }\n  requestAnimationFrame(step);\n}\n\n/* ============================================================================\n   Per-slide enter triggers\n   ============================================================================ */\nfunction triggerSlideEnter(idx){\n  // idx is 0-based\n  if(idx === 3){ // slide 4 — 3D\n    Three.init();\n    wireSlide4();\n  }\n  if(idx === 4){ // slide 5 — injection\n    Injection.init();\n  }\n  if(idx === 5){ // slide 6 — bar chart\n    animateBars();\n  }\n}\n\n/* Initial */\ndocument.querySelectorAll('.slide')[0].classList.add('is-active');\nupdateChrome();\n// Ensure first-slide entry fires\nsetTimeout(() => triggerSlideEnter(0), 100);\n\n/* ============================================================================\n   GUÍA DE EDICIÓN — Cómo cambiar textos sin romper animaciones\n   ============================================================================\n   1. ESTRUCTURA. Cada slide vive en un <section class=\"slide\" data-slide=\"NN\">\n      dentro del <template id=\"tpl-slides\"> al inicio del <body>. Hay 20 slides.\n\n   2. TEXTO. Para cambiar copys, edita el contenido entre etiquetas dentro de\n      cada <section>. Mantén las clases (.title, .kicker, .eyebrow, .kpi, etc.)\n      — son las que el CSS y los animadores buscan.\n\n   3. NÚMEROS ANIMADOS (slide 6). Los contadores con la clase .num-counter se\n      animan desde 0 hasta el atributo data-target. Para cambiar el valor final\n      edita data-target=\"9.82\" (o el que sea). data-decimals controla decimales.\n\n   4. BARRAS LOGARÍTMICAS (slide 6). Cada .bar-row tiene un nombre y una\n      \"longitud\" determinada por la función pctForLog en el bloque animateBars.\n      Para mover una barra cambia el valor en el array `explicit` (porcentaje)\n      o el log objetivo (-6, -13, -16, -13). NO toques las clases .bar-row,\n      .bar-track, .bar-fill — son las que se animan.\n\n   5. THREE.JS (slide 4). La geometría se construye en Three.build(). Las\n      constantes SPAN_X, RIB_W, SU8_T, AU_T, N_LONG, TRANS_SPACING y ALPHA\n      controlan la forma. Los colores siguen la paleta forest/gold. Los tres\n      botones (#btn-rotate, #btn-section, #btn-reset) están cableados al final.\n\n   6. INYECCIÓN (slide 5). El canvas se dibuja en Injection.draw(). La timeline\n      tiene 4 fases iguales (0-0.25, 0.25-0.5, 0.5-0.75, 0.75-1). Para cambiar\n      la velocidad por defecto, busca `phase += dt * 0.13 * speed` y ajusta\n      0.13. Los nombres de fase están en el array `phases`.\n\n   7. NOTAS DEL PRESENTADOR. El array NOTES tiene 20 strings, uno por slide.\n      Edítalo libremente — se muestra al pulsar la tecla N.\n\n   8. ATAJOS. ←/→ navegar, N notas, F fullscreen, Espacio pausar 3D.\n\n   9. PALETA. Las variables CSS al inicio del <style> (--forest, --moss,\n      --gold, --cream, --char) son la fuente única de verdad de color.\n\n   10. NO mover: los <canvas>, los IDs (#three-host, #inj-canvas, #cursor,\n       #veil, #progress, #counter), las clases .slide, .canvas-1080, .stage.\n       Si necesitas reordenar slides, mueve el <section> entero — el chrome\n       y la numeración se recalculan automáticamente.\n\n   ============================================================================ */\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
